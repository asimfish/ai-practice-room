<g font-family="system-ui, -apple-system, sans-serif" fill="#183153">
<text x="80" y="105" font-size="35" fill="#0F766E" font-weight="700">英语一句话 · 03</text>
<text x="80" y="195" font-size="61" font-weight="750">开窗：我来 / 你来？</text>
<rect x="365" y="265" width="350" height="330" rx="20" fill="#DDF2EB" stroke="#183153" stroke-width="8"/>
