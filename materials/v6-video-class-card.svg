<rect x="112" y="832" width="130" height="64" rx="18" fill="#0F766E"/>
<text x="146" y="878" fill="#FFFFFF" font-size="41" font-weight="700">I</text>
<text x="282" y="875" font-size="39" font-weight="700">我来做 · 请求许可</text>
<text x="112" y="977" font-size="55" font-weight="650">Can I open the window?</text>
<text x="112" y="1061" font-size="44">我可以开窗吗？</text>
<rect x="70" y="1170" width="940" height="330" rx="32" fill="#FFFFFF" stroke="#CAD5D5" stroke-width="4"/>
<rect x="112" y="1210" width="130" height="64" rx="18" fill="#0F766E"/>
<text x="134" y="1256" fill="#FFFFFF" font-size="38" font-weight="700">you</text>
<text x="282" y="1253" font-size="39" font-weight="700">请你做 · 请求帮忙</text>
<text x="112" y="1355" font-size="52" font-weight="650">Can you open the window?</text>
<text x="112" y="1439" font-size="44">你可以帮忙开窗吗？</text>
<text x="80" y="1610" font-size="40" font-weight="700">同一个动作，先看谁做。</text>
<text x="80" y="1680" font-size="32">只解释这个开窗请求场景。</text>
<text x="80" y="1740" font-size="29" fill="#4D6478">can 还有其他用法，不能写成“永远”。</text>
<text x="80" y="1840" font-size="25" fill="#4D6478">本站原创静态示意 · 未生成视频 · 例句由编辑器排版</text>
