<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="title desc">
<title id="title">开窗场景中Can I与Can you的原创课堂句型卡</title><desc id="desc">同一扇窗，Can I open the window请求自己开窗的许可，Can you open the window请对方帮忙。仅说明本情境，不是can全部用法。本站原创静态图示。</desc>
