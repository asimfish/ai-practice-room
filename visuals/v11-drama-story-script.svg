<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">旧书冲突：每句对白推动一个改变</title><desc id="desc">这是人物在行动，还是旁白替他们讲完道理？。剧本设计输入：许远：想用买书避开迟到告别；林岚：拒卖，不想再次替他收尾；朋友关系；不凭空改成情侣或家人。剧本示范目标：问价 → 拒售 → 保留真相；承认逃避 → 说清需要 → 道歉；16句对白有角色、动作与试读记录。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">旧书冲突：每句对白推动一个改变</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#784da0"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">剧本设计输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">许远：想用买书避开迟到</tspan><tspan x="64" dy="32.400000000000006">告别</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">林岚：拒卖，不想再次替</tspan><tspan x="64" dy="32.400000000000006">他收尾</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">朋友关系；不凭空改成情</tspan><tspan x="64" dy="32.400000000000006">侣或家人</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">剧本示范目标</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f4edfc" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">问价 → 拒售 → 保留真相</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">承认逃避 → 说清需要 → 道歉</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">16句对白有角色、动作与试读记录</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>