<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">成片终审、手续具备与上线分开</title><desc id="desc">一部能导出的片子，还缺哪些交付证据？。终审真实输入：实际AI动态素材与原创剧情；最终工程、MP4、声音和字幕；来源用途与逐镜修复记录。终审示范目标：记录故事、动态、口型与音画质量；电脑、手机完整播放并定位问题；质量结论与手续、上线状态分别填。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">成片终审、手续具备与上线分开</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#784da0"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">终审真实输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">实际AI动态素材与原创</tspan><tspan x="64" dy="32.400000000000006">剧情</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">最终工程、MP4、声音和</tspan><tspan x="64" dy="32.400000000000006">字幕</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">来源用途与逐镜修复记录</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">终审示范目标</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#f4edfc" stroke="none"/><circle cx="454" cy="215" r="15" fill="#784da0"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">主要AI动态叙事与可见对白口型满足正</tspan><tspan x="481" dy="31.05">文质量门。</tspan></text><circle cx="454" cy="278" r="15" fill="#784da0"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">真实MP4、完整播放和素材用途有证据，</tspan><tspan x="481" dy="31.05">未查项保持未查。</tspan></text><circle cx="454" cy="341" r="15" fill="#784da0"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">独立迁移须自写新冲突的实际动态终版及</tspan><tspan x="481" dy="31.05">审片记录。</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>