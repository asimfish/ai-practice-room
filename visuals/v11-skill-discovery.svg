<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">从一个能力缺口走到最小测试</title><desc id="desc">找到“能做PPT”的介绍后，还缺什么证据？。具体能力缺口：现有稿件只能看，不能改字；目标：得到可编辑的3页稿；无隐私通知材料作为小样。带证据级别的候选：官方资料支持：说明能做什么；入口可见：本人账号看得到；小样通过：真实文件可改字。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f0edfb" stroke="none"/><text x="30" y="52" font-size="32" fill="#6650ae" font-weight="750"><tspan x="30" dy="0">从一个能力缺口走到最小测试</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#6650ae"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#6650ae" font-weight="700"><tspan x="120" dy="0">具体能力缺口</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">现有稿件只能看，不能改</tspan><tspan x="64" dy="32.400000000000006">字</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">目标：得到可编辑的3页</tspan><tspan x="64" dy="32.400000000000006">稿</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">无隐私通知材料作为小样</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6650ae" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6650ae" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">带证据级别的候选</tspan></text><circle cx="490.75" cy="228" r="31" fill="#6650ae"/><text x="482.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="482.75" dy="0">1</tspan></text><text x="435" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="435" dy="0">写一处缺口</tspan></text><path d="M544.5 228h28m-9-8l9 8-9 8" stroke="#6650ae" stroke-width="3" fill="none"/><circle cx="618.25" cy="228" r="31" fill="#6650ae"/><text x="610.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="610.25" dy="0">2</tspan></text><text x="562.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="562.5" dy="0">读条件</tspan></text><path d="M672 228h28m-9-8l9 8-9 8" stroke="#6650ae" stroke-width="3" fill="none"/><circle cx="745.75" cy="228" r="31" fill="#6650ae"/><text x="737.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="737.75" dy="0">3</tspan></text><text x="690" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="690" dy="0">选五分钟小</tspan><tspan x="690" dy="32.400000000000006">样</tspan></text><path d="M799.5 228h28m-9-8l9 8-9 8" stroke="#6650ae" stroke-width="3" fill="none"/><circle cx="873.25" cy="228" r="31" fill="#6650ae"/><text x="865.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="865.25" dy="0">4</tspan></text><text x="817.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="817.5" dy="0">给证据级别</tspan></text><text x="438" y="397" font-size="23" fill="#6650ae" font-weight="600"><tspan x="438" dy="0">官方资料支持：说明能做什么</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6650ae" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>