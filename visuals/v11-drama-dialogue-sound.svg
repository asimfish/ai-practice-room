<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">D04由林岚说，D12必须保留“没”</title><desc id="desc">实际听到的字、说话者和可见嘴部都对应吗？。声音路线输入：16句原台词与voice-map.csv；许远A1_M、林岚A2_F角色声轨；本人录音、原生声音或兼容口型路线。声音示范目标：先验证D04“还在。但不卖。”；D12否定与全剧因果完整；实读、实听、字幕和口型分别核对。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">D04由林岚说，D12必须保留“没”</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#784da0"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">声音路线输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">16句原台词与voice-</tspan><tspan x="64" dy="32.400000000000006">map.csv</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">许远A1_M、林岚A2_F角</tspan><tspan x="64" dy="32.400000000000006">色声轨</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">本人录音、原生声音或兼</tspan><tspan x="64" dy="32.400000000000006">容口型路线</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">声音示范目标</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#f4edfc" stroke="none"/><circle cx="454" cy="215" r="15" fill="#784da0"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">16句原台词与说话者准确，声音来源可</tspan><tspan x="481" dy="31.05">解释。</tspan></text><circle cx="454" cy="278" r="15" fill="#784da0"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">可见讲话嘴部可信，反应镜承载画外音有</tspan><tspan x="481" dy="31.05">剧情理由。</tspan></text><circle cx="454" cy="341" r="15" fill="#784da0"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">全片主要AI动态叙事仍须完成，声音计</tspan><tspan x="481" dy="31.05">划不算成品。</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>