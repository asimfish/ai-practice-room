<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">先听 I/you，再核字幕与声音来源</title><desc id="desc">字幕对了，实际声音也真的说对了吗？。声音校对输入：英文与中文夹英语是不同台词版本；三份计划SRT不含实际声音；本人录音或已明确用途的音色。校对示范目标：所选音频与对应SRT配对；英语、主语、问号与时间逐句检查；耳机与手机外放完整试听。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">先听 I/you，再核字幕与声音来源</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#784da0"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">声音校对输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">英文与中文夹英语是不同</tspan><tspan x="64" dy="32.400000000000006">台词版本</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">三份计划SRT不含实际声</tspan><tspan x="64" dy="32.400000000000006">音</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">本人录音或已明确用途的</tspan><tspan x="64" dy="32.400000000000006">音色</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">校对示范目标</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#f4edfc" stroke="none"/><circle cx="454" cy="215" r="15" fill="#784da0"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">SRT文本与所用音频版本对应，不把计划</tspan><tspan x="481" dy="31.05">时间当同步。</tspan></text><circle cx="454" cy="278" r="15" fill="#784da0"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">声音说错时已修声音；未提供音频的项保</tspan><tspan x="481" dy="31.05">留待确认。</tspan></text><circle cx="454" cy="341" r="15" fill="#784da0"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">完整试听与来源记录实际完成，字幕手机</tspan><tspan x="481" dy="31.05">可读。</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>