<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同一能力目标做三层练习</title><desc id="desc">难度是否改变支持程度，而仍考can/can’t？。固定范围：目标：can/can’t表达动物能力；仅用bird/fish/rabbit/cat及4个动作词；基础、标准、提高各5题，共15题。教学示范·三层题包：基础：示例＋词库；标准：少提示；提高：同词表换情境，自主表达；新15题与原题库课末小测1/3/5分开标识。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#e8f5f0" stroke="none"/><text x="30" y="52" font-size="32" fill="#34746d" font-weight="750"><tspan x="30" dy="0">同一能力目标做三层练习</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#34746d"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#34746d" font-weight="700"><tspan x="120" dy="0">固定范围</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">目标：can/can’t表达</tspan><tspan x="64" dy="32.400000000000006">动物能力</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">仅用bird/fish/rabbit</tspan><tspan x="64" dy="32.400000000000006">/cat及4个动作词</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">基础、标准、提高各5题</tspan><tspan x="64" dy="32.400000000000006">，共15题</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#34746d" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#34746d" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·三层题包</tspan></text><rect x="423" y="173" width="530" height="250" rx="8" fill="#f8fafc" stroke="#e0e7f0"/><rect x="425" y="175" width="525" height="38" rx="0" fill="#e8f5f0" stroke="none"/><text x="437" y="201" font-size="22" fill="#34746d" font-weight="700"><tspan x="437" dy="0">层级</tspan></text><text x="607" y="201" font-size="22" fill="#34746d" font-weight="700"><tspan x="607" dy="0">学生题（节选）</tspan></text><text x="777" y="201" font-size="22" fill="#34746d" font-weight="700"><tspan x="777" dy="0">教师答案与判定</tspan><tspan x="777" dy="29.700000000000003">标准</tspan></text><rect x="425" y="215" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">基础1</tspan></text><text x="607" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">A fish can _</tspan><tspan x="607" dy="29.700000000000003">__. 词库swim/</tspan><tspan x="607" dy="29.700000000000003">fly</tspan></text><text x="777" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">swim</tspan></text><rect x="425" y="255" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">标准1</tspan></text><text x="607" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">A fish ___ </tspan><tspan x="607" dy="29.700000000000003">fly. can/can</tspan><tspan x="607" dy="29.700000000000003">’t</tspan></text><text x="777" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">can’t</tspan></text><rect x="425" y="295" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">提高1</tspan></text><text x="607" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">画cat，用can</tspan><tspan x="607" dy="29.700000000000003">写能力句</tspan></text><text x="777" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">如A cat can </tspan><tspan x="777" dy="29.700000000000003">run.</tspan></text><rect x="425" y="335" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">共同目标</tspan></text><text x="607" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">can/can’t能</tspan><tspan x="607" dy="29.700000000000003">力表达</tspan></text><text x="777" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">can后动词原形</tspan></text><rect x="425" y="375" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">产物数量</tspan></text><text x="607" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">三层各5题，新</tspan><tspan x="607" dy="29.700000000000003">15题</tspan></text><text x="777" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">学生稿不含答案</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#34746d" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>