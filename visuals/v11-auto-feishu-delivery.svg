<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">审核后文本、发送身份与测试群对齐</title><desc id="desc">这份已审文本要由谁发给哪个明确对象？。发送设计输入：指定日报ID与待人工审核的版本；虚构目标：可分享测试组；本人授权、当前身份与配置权限待核。链路示范目标：原记录 → 草稿 → 人审 → 指定测试群；按钮只引用所在审核行的核准版本；真实消息与日志确认后回填状态。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#ecf6ef" stroke="none"/><text x="30" y="52" font-size="32" fill="#397062" font-weight="750"><tspan x="30" dy="0">审核后文本、发送身份与测试群对齐</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#397062"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#397062" font-weight="700"><tspan x="120" dy="0">发送设计输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">指定日报ID与待人工审</tspan><tspan x="64" dy="32.400000000000006">核的版本</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">虚构目标：可分享测试组</tspan></text><text x="64" y="355.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">本人授权、当前身份与配</tspan><tspan x="64" dy="32.400000000000006">置权限待核</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#397062" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#397062" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">链路示范目标</tspan></text><circle cx="490.75" cy="228" r="31" fill="#397062"/><text x="482.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="482.75" dy="0">1</tspan></text><text x="435" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="435" dy="0">写明确群对</tspan><tspan x="435" dy="32.400000000000006">象</tspan></text><path d="M544.5 228h28m-9-8l9 8-9 8" stroke="#397062" stroke-width="3" fill="none"/><circle cx="618.25" cy="228" r="31" fill="#397062"/><text x="610.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="610.25" dy="0">2</tspan></text><text x="562.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="562.5" dy="0">查核准版本</tspan></text><path d="M672 228h28m-9-8l9 8-9 8" stroke="#397062" stroke-width="3" fill="none"/><circle cx="745.75" cy="228" r="31" fill="#397062"/><text x="737.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="737.75" dy="0">3</tspan></text><text x="690" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="690" dy="0">本人核身份</tspan><tspan x="690" dy="32.400000000000006">权限</tspan></text><path d="M799.5 228h28m-9-8l9 8-9 8" stroke="#397062" stroke-width="3" fill="none"/><circle cx="873.25" cy="228" r="31" fill="#397062"/><text x="865.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="865.25" dy="0">4</tspan></text><text x="817.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="817.5" dy="0">实际确认送</tspan><tspan x="817.5" dy="32.400000000000006">达</tspan></text><text x="438" y="397" font-size="23" fill="#397062" font-weight="600"><tspan x="438" dy="0">原记录 → 草稿 → 人审 → 指定测试群</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#397062" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>