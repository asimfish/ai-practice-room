<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">两轮反馈：先修事实，再保留未知</title><desc id="desc">怎样指出错误，并检验修订规则能否迁移？。查错练习输入：原材料：14:00–16:00，8人；错误稿：15:00–17:00，12人；错误稿还编了“李老师”。两轮修订与新条件：第一轮：纠正时间和人数；第二轮：删除无依据联系人；换6人：总预算应为120元。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf5ef" stroke="none"/><text x="30" y="52" font-size="32" fill="#326452" font-weight="750"><tspan x="30" dy="0">两轮反馈：先修事实，再保留未知</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#326452"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#326452" font-weight="700"><tspan x="120" dy="0">查错练习输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">原材料：14:00–16:00</tspan><tspan x="64" dy="32.400000000000006">，8人</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">错误稿：15:00–17:00</tspan><tspan x="64" dy="32.400000000000006">，12人</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">错误稿还编了“李老师”</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#326452" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#326452" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">两轮修订与新条件</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#eaf5ef" stroke="none"/><circle cx="454" cy="215" r="15" fill="#326452"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">两轮都有问题位置、依据和期望</tspan></text><circle cx="454" cy="278" r="15" fill="#326452"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">正确内容及未知项没有被误改</tspan></text><circle cx="454" cy="341" r="15" fill="#326452"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">6×20=120，人数变化未改每人预算</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#326452" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>