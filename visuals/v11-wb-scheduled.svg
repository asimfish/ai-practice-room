<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">定时草稿先核对日期与输入</title><desc id="desc">旧记录、缺记录或运行成功但无文件时会怎样？。模拟日期与记录：现有R01/R02/R03记录日期为2026-10-09；R04为2026-10-08，不并入10-09日报；教学模拟目标10-09；实际任务日期另核对。教学示范·一次性检查路径：日期一致→只生成本地日报草稿→人核对；缺文件、空记录或日期不同→停止并报告；任务状态、文件、内容、通知分别验收。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf1fc" stroke="none"/><text x="30" y="52" font-size="32" fill="#315e9e" font-weight="750"><tspan x="30" dy="0">定时草稿先核对日期与输入</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#315e9e"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#315e9e" font-weight="700"><tspan x="120" dy="0">模拟日期与记录</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">现有R01/R02/R03记录</tspan><tspan x="64" dy="32.400000000000006">日期为2026-10-09</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">R04为2026-10-08，不</tspan><tspan x="64" dy="32.400000000000006">并入10-09日报</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">教学模拟目标10-09；实</tspan><tspan x="64" dy="32.400000000000006">际任务日期另核对</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#315e9e" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#315e9e" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·一次性检查路径</tspan></text><circle cx="490.75" cy="228" r="31" fill="#315e9e"/><text x="482.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="482.75" dy="0">1</tspan></text><text x="435" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="435" dy="0">手动审一稿</tspan></text><path d="M544.5 228h28m-9-8l9 8-9 8" stroke="#315e9e" stroke-width="3" fill="none"/><circle cx="618.25" cy="228" r="31" fill="#315e9e"/><text x="610.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="610.25" dy="0">2</tspan></text><text x="562.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="562.5" dy="0">本人配一次</tspan><tspan x="562.5" dy="32.400000000000006">性</tspan></text><path d="M672 228h28m-9-8l9 8-9 8" stroke="#315e9e" stroke-width="3" fill="none"/><circle cx="745.75" cy="228" r="31" fill="#315e9e"/><text x="737.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="737.75" dy="0">3</tspan></text><text x="690" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="690" dy="0">分别看结果</tspan></text><path d="M799.5 228h28m-9-8l9 8-9 8" stroke="#315e9e" stroke-width="3" fill="none"/><circle cx="873.25" cy="228" r="31" fill="#315e9e"/><text x="865.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="865.25" dy="0">4</tspan></text><text x="817.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="817.5" dy="0">测失败并停</tspan><tspan x="817.5" dy="32.400000000000006">用</tspan></text><text x="438" y="397" font-size="23" fill="#315e9e" font-weight="600"><tspan x="438" dy="0">日期一致→只生成本地日报草稿→人核对</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#315e9e" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>