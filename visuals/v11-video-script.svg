<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">借进来还是借出去：一句口播讲清</title><desc id="desc">观众听完能选对 borrow 和 lend 吗？。先限定口播：观众：初一英语学习者；问题：borrow / lend 的方向；已有例句与一个填空题。脚本示范目标：只解释一个易混点；有例句、问题与准确答案；真实读稿后控制在30–60秒。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">借进来还是借出去：一句口播讲清</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#784da0"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">先限定口播</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">观众：初一英语学习者</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">问题：borrow / lend </tspan><tspan x="64" dy="32.400000000000006">的方向</tspan></text><text x="64" y="355.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">已有例句与一个填空题</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">脚本示范目标</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f4edfc" stroke="none"