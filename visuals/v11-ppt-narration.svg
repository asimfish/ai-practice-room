<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">三页能力课补讲解与练习停顿</title><desc id="desc">没有现场老师，观众能否听懂并有时间作答？。已审核素材：三页：目标、示范、原题1/3/5；can/can’t与已学动物、动作词；自录或有权使用音色；先试一页。教学示范·3分钟微课计划：页1 30秒，页2 60秒，页3 90秒，共180秒；页3含读题30秒、练习30秒、解释30秒；音画时长、英语发音与许可实际核对。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#fff1e5" stroke="none"/><text x="30" y="52" font-size="32" fill="#aa5728" font-weight="750"><tspan x="30" dy="0">三页能力课补讲解与练习停顿</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="58" height="43" rx="7" fill="#aa5728"/><path d="M71 140l17 12-17 12z" fill="white"/><text x="120" y="153" font-size="25" fill="#aa5728" font-weight="700"><tspan x="120" dy="0">已审核素材</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">三页：目标、示范、原题</tspan><tspan x="64" dy="32.400000000000006">1/3/5</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">can/can’t与已学动物</tspan><tspan x="64" dy="32.400000000000006">、动作词</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">自录或有权使用音色；先</tspan><tspan x="64" dy="32.400000000000006">试一页</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#aa5728" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#aa5728" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy=