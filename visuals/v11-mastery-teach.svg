<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">把隐含判断写出来，别人才能独立复现</title><desc id="desc">亲友卡住时，哪些口头补充必须写回手册？。一项已做流程：自己的输入、路径和真实检查记录；成功信号、费用上限与停止条件；亲友独立试做，未做标待复现。个人手册草稿与修订：目标、准备、逐步操作与验收；三道理解检查题；真实卡点与对应修订，未试不补造。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#faf1e7" stroke="none"/><text x="30" y="52" font-size="32" fill="#785330" font-weight="750"><tspan x="30" dy="0">把隐含判断写出来，别人才能独立复现</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#785330"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#785330" font-weight="700"><tspan x="120" dy="0">一项已做流程</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">自己的输入、路径和真实</tspan><tspan x="64" dy="32.400000000000006">检查记录</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">成功信号、费用上限与停</tspan><tspan x="64" dy="32.400000000000006">止条件</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">亲友独立试做，未做标待</tspan><tspan x="64" dy="32.400000000000006">复现</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#785330" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#785330" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">个人手册草稿与修订</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#faf1e7" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">目标、准备、逐步操作与验收</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">三道理解检查题</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">真实卡点与对应修订，未试不补造</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#785330" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>