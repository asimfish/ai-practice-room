<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">从真实瓶颈到一次只改变一个条件的小范围比较</title><desc id="desc">发现官方新功能后，怎样决定是否写进自己的方法？。一个已有瓶颈：示范问题：PPT图表不能改数字；记录官方变化的日期与适用条件；固定材料、任务和验收标准。证据驱动的方法更新：只改变一个功能或工具；记录可编辑性、时间、费用与失败；按结果保留、修改或放弃候选。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#faf1e7" stroke="none"/><text x="30" y="52" font-size="32" fill="#785330" font-weight="750"><tspan x="30" dy="0">从真实瓶颈到一次只改变一个条件的小范围比较</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="58" height="43" rx="7" fill="#785330"/><path d="M71 140l17 12-17 12z" fill="white"/><text x="120" y="153" font-size="25" fill="#785330" font-weight="700"><tspan x="120" dy="0">一个已有瓶颈</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">示范问题：PPT图表不能</tspan><tspan x="64" dy="32.400000000000006">改数字</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">记录官方变化的日期与适</tspan><tspan x="64" dy="32.400000000000006">用条件</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">固定材料、任务和验收标</tspan><tspan x="64" dy="32.400000000000006">准</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#785330" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#785330" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">证据驱动的方法更新</tspan></text><rect x="425" y="177" width="164" height="154" rx="8" fill="#faf1e7" stroke="none"/><path d="M437 315l48-40 34 25 32-18 26 33z" fill="#785330" opacity=".25"/><circle cx="470" cy="217" r="15" fill="#785330" opacity=".8"/><path d="M449 262q20-52 41 0" fill="#785330" opacity=".8"/><circle cx="539" cy="219" r="15" fill="#785330" opacity=".5"/><path d="M517 267q21-51 42 0" fill="#785330" opacity=".5"/><text x="435" y="199" font-size="17" fill="#785330" font-weight="700"><tspan x="435" dy="0">01</tspan></text><text x="433" y="353" font-size="21" fill="#263e52" font-weight="500"><tspan x="433" dy="0">只改变一个功能</tspan><tspan x="433" dy="28.35">或工具</tspan></text><rect x="602" y="177" width="164" height="154" rx="8" fill="#faf1e7" stroke="none"/><path d="M614 315l48-40 34 25 32-18 26 33z" fill="#785330" opacity=".25"/><circle cx="647" cy="217" r="15" fill="#785330" opacity=".8"/><path d="M626 262q20-52 41 0" fill="#785330" opacity=".8"/><circle cx="716" cy="219" r="15" fill="#785330" opacity=".5"/><path d="M694 267q21-51 42 0" fill="#785330" opacity=".5"/><text x="612" y="199" font-size="17" fill="#785330" font-weight="700"><tspan x="612" dy="0">02</tspan></text><text x="610" y="353" font-size="21" fill="#263e52" font-weight="500"><tspan x="610" dy="0">记录可编辑性、</tspan><tspan x="610" dy="28.35">时间、费用与失</tspan><tspan x="610" dy="28.35">败</tspan></text><rect x="779" y="177" width="164" height="154" rx="8" fill="#faf1e7" stroke="none"/><path d="M791 315l48-40 34 25 32-18 26 33z" fill="#785330" opacity=".25"/><circle cx="824" cy="217" r="15" fill="#785330" opacity=".8"/><path d="M803 262q20-52 41 0" fill="#785330" opacity=".8"/><circle cx="893" cy="219" r="15" fill="#785330" opacity=".5"/><path d="M871 267q21-51 42 0" fill="#785330" opacity=".5"/><text x="789" y="199" font-size="17" fill="#785330" font-weight="700"><tspan x="789" dy="0">03</tspan></text><text x="787" y="353" font-size="21" fill="#263e52" font-weight="500"><tspan x="787" dy="0">按结果保留、修</tspan><tspan x="787" dy="28.35">改或放弃候选</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#785330" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>