<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">完整技能目录到三页可编辑试作品</title><desc id="desc">为什么只复制SKILL.md仍可能无法导出PPTX？。先选一种安装路线：原项目全仓库ZIP或skill-only；内层含SKILL.md、scripts与资源；Python 3.10+与实际解释器路径。小样与环境记录：3页“我的AI第一课”PPTX；打开并修改一段原生文字；路径、解释器、未运行检查。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f1edff" stroke="none"/><text x="30" y="52" font-size="32" fill="#6355ba" font-weight="750"><tspan x="30" dy="0">完整技能目录到三页可编辑试作品</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 131h21l7 9h30v34h-58z" fill="#6355ba"/><path d="M57 150h39m-39 10h30" stroke="white" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#6355ba" font-weight="700"><tspan x="120" dy="0">先选一种安装路线</tspan></text><path d="M64 195v183m0-140h20m-20 70h20m-20 70h20" stroke="#6355ba" stroke-width="3" fill="none"/><text x="90" y="221" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">原项目全仓库ZIP或</tspan><tspan x="90" dy="32.400000000000006">skill-only</tspan></text><text x="90" y="289.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">内层含SKILL.md、</tspan><tspan x="90" dy="32.400000000000006">scripts与资源</tspan></text><text x="90" y="358.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">Python 3.10+与实际</tspan><tspan x="90" dy="32.400000000000006">解释器路径</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6355ba" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6355ba" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">小样与环境记录</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f1edff" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">3页“我的AI第一课”PPTX</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">打开并修改一段原生文字</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">路径、解释器、未运行检查</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6355ba" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>