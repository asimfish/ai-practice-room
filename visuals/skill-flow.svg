<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 666" role="img"><title>Skill探索与试用教学示意</title><rect width="420" height="666" rx="16" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="25" font-weight="700" fill="#182341">Skill探索与试用</text><text x="24" y="69" font-size="16" fill="#59657e">原创教学图解 · 不是软件界面截图</text><rect x="24" y="92" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="122" r="15" fill="#244fe3"/><text x="50" y="128" text-anchor="middle" font-size="17" fill="white">1</text><text x="76" y="129" font-size="23" font-weight="700" fill="#182341">发现候选</text><text x="42" y="160" font-size="24" fill="#59657e">目录、热榜只是线索</text><path d="M210 183v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="204" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="234" r="15" fill="#244fe3"/><text x="50" y="240" text-anchor="middle" font-size="17" fill="white">2</text><text x="76" y="241" font-size="23" font-weight="700" fill="#182341">回到原始项目</text><text x="42" y="272" font-size="24" fill="#59657e">读说明、许可与依赖</text><path d="M210 295v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="316" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="346" r="15" fill="#244fe3"/><text x="50" y="352" text-anchor="middle" font-size="17" fill="white">3</text><text x="76" y="353" font-size="23" font-weight="700" fill="#182341">选正确宿主和范围</text><text x="42" y="384" font-size="24" fill="#59657e">Codex、Harness分别核对</text><path d="M210 407v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="428" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="458" r="15" fill="#244fe3"/><text x="50" y="464" text-anchor="middle" font-size="17" fill="white">4</text><text x="76" y="465" font-size="23" font-weight="700" fill="#182341">单项小测试</text><text x="42" y="496" font-size="24" fill="#59657e">先用副本，检查真文件</text><path d="M210 519v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="540" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="570" r="15" fill="#244fe3"/><text x="50" y="576" text-anchor="middle" font-size="17" fill="white">5</text><text x="76" y="577" font-size="23" font-weight="700" fill="#182341">决定保留或停用</text><text x="42" y="608" font-size="24" fill="#59657e">换输入复现，记录边界</text></g></svg>