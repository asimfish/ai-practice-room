<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">预算按原记录算，财报三指标不补造</title><desc id="desc">这个数字来自哪笔记录、哪份原文与哪个期间？。金融练习输入：六笔已有虚构预算B01–B06，单位人民币元；公开财报原文：本示范未选、未读取；期间、公告日期、币种、口径与页码待核。整理示范目标：收入/支出分类，结余＝收入合计－支出合计；三项财报指标均保留来源与数据身份；未找到的值如实写未找到，推测单列。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#ecf6ef" stroke="none"/><text x="30" y="52" font-size="32" fill="#397062" font-weight="750"><tspan x="30" dy="0">预算按原记录算，财报三指标不补造</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#397062"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#397062" font-weight="700"><tspan x="120" dy="0">金融练习输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">六笔已有虚构预算B01–</tspan><tspan x="64" dy="32.400000000000006">B06，单位人民币元</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">公开财报原文：本示范未</tspan><tspan x="64" dy="32.400000000000006">选、未读取</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">期间、公告日期、币种、</tspan><tspan x="64" dy="32.400000000000006">口径与页码待核</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#397062" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#397062" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">整理示范目标</tspan></text><rect x="423" y="173" width="530" height="250" rx="8" fill="#f8fafc" stroke="#e0e7f0"/><rect x="425" y="175" width="525" height="38" rx="0" fill="#ecf6ef" stroke="none"/><text x="436" y="201" font-size="22" fill="#397062" font-weight="700"><tspan x="436" dy="0">B01收入5000；B02固定支出1800（人民币元，虚构</tspan><tspan x="436" dy="29.700000000000003">）</tspan></text><rect x="425" y="215" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="436" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">B03餐饮800；B04交通200（人民币元，虚构）</tspan></text><rect x="425" y="255" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="436" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">B05资料订阅60；B06可选活动300（人民币元，虚</tspan><tspan x="436" dy="29.700000000000003">构）</tspan></text><rect x="425" y="295" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">营业收入：未找到</tspan></text><text x="692" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="692" dy="0">报告、期间、单位、页码</tspan><tspan x="692" dy="29.700000000000003">待核</tspan></text><rect x="425" y="335" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">净利润：未找到</tspan></text><text x="692" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="692" dy="0">具体指标与合并/母公司</tspan><tspan x="692" dy="29.700000000000003">口径待核</tspan></text><rect x="425" y="375" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">经营活动现金流：未找到</tspan></text><text x="692" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="692" dy="0">原文表名与核实状态待填</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#397062" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>