<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">用两个主题检验同一套页面规则</title><desc id="desc">设计规则换成英语内容后还能清楚展示吗？。参考与新主题：有权复用的四页深蓝标题模板；主题A：社区电脑课三个操作目标；主题B：can/can’t英语课三个能力目标。教学示范·设计规则与两稿：标题区、正文层次、留白与证据位置写清；两主题各做封面、内容、图表/对照三页小样；规则说明与真实模板工作区路径分别保存。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#fff1e5" stroke="none"/><text x="30" y="52" font-size="32" fill="#aa5728" font-weight="750"><tspan x="30" dy="0">用两个主题检验同一套页面规则</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="39" rx="4" fill="#aa5728"/><path d="M77 168v12m-13 0h26" stroke="#aa5728" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#aa5728" font-weight="700"><tspan x="120" dy="0">参考与新主题</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">有权复用的四页深蓝标题</tspan><tspan x="64" dy="32.400000000000006">模板</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">主题A：社区电脑课三个</tspan><tspan x="64" dy="32.400000000000006">操作目标</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">主题B：can/can’t英语</tspan><tspan x="64" dy="32.400000000000006">课三个能力目标</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#aa5728" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#aa5728" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·设计规则与两稿</tspan></text><rect x="425" y="172" width="525" height="248" rx="12" fill="#fff1e5" stroke="none"/><text x="449" y="211" font-size="27" fill="#aa5728" font-weight="750"><tspan x="449" dy="0">教学示范·同规则的两种已填页面</tspan></text><text x="449" y="257" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">规则：顶部观点标题，正文最多3项，解释</tspan><tspan x="449" dy="32.400000000000006">放备注</tspan></text><text x="449" y="307" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">电脑稿标题：先把文件放进自己的文件夹</tspan></text><text x="449" y="357" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">电脑稿正文：创建practice｜保存notes.</tspan><tspan x="449" dy="32.400000000000006">txt｜改名找回</tspan></text><text x="780" y="409" font-size="15" fill="#52677a" font-weight="500"><tspan x="780" dy="0">幻灯片内容示范</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#aa5728" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>