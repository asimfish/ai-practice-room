<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">教案工具包：三种职责，三次不同输入</title><desc id="desc">怎样证明少量工具能复用，而不是只装得多？。只选英语教案领域：资料整理、作品制作、交付检查；每类最多一项，合计不超过三项；来源、版本、范围与依赖记档。职责与实践计划：词表与目标 → 教案 → 检查报告；跟课小样、新材料、缺项任务；有三次证据后才评价稳定复用。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f0edfb" stroke="none"/><text x="30" y="52" font-size="32" fill="#6650ae" font-weight="750"><tspan x="30" dy="0">教案工具包：三种职责，三次不同输入</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="45" rx="5" fill="#6650ae"/><path d="M69 129v45m0-23h37" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#6650ae" font-weight="700"><tspan x="120" dy="0">只选英语教案领域</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">资料整理、作品制作、交</tspan><tspan x="64" dy="32.400000000000006">付检查</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">每类最多一项，合计不超</tspan><tspan x="64" dy="32.400000000000006">过三项</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">来源、版本、范围与依赖</tspan><tspan x="64" dy="32.400000000000006">记档</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6650ae" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6650ae" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">职责与实践计划</tspan></text><rect x="423" y="174" width="530" height="238" rx="10" fill="#23374d" stroke="none"/><rect x="435" y="189" width="157" height="200" rx="6" fill="#f9fcff" stroke="none"/><text x="448" y="217" font-size="22" fill="#6650ae" font-weight="700"><tspan x="448" dy="0">对话</tspan></text><text x="447" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="447" dy="0">词表与目标 </tspan><tspan x="447" dy="28.35">→ 教案 → </tspan><tspan x="447" dy="28.35">检查报告</tspan></text><rect x="605" y="189" width="157" height="200" rx="6" fill="#eaf1fb" stroke="none"/><text x="618" y="217" font-size="22" fill="#6650ae" font-weight="700"><tspan x="618" dy="0">文件</tspan></text><text x="617" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="617" dy="0">跟课小样、新</tspan><tspan x="617" dy="28.35">材料、缺项任</tspan><tspan x="617" dy="28.35">务</tspan></text><rect x="775" y="189" width="157" height="200" rx="6" fill="#e3edf5" stroke="none"/><text x="788" y="217" font-size="22" fill="#6650ae" font-weight="700"><tspan x="788" dy="0">执行</tspan></text><text x="787" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="787" dy="0">有三次证据后</tspan><tspan x="787" dy="28.35">才评价稳定复</tspan><tspan x="787" dy="28.35">用</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6650ae" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>