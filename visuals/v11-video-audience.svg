<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">三条选题各回答一个 can 问题</title><desc id="desc">三条内容有独立帮助，还是同一段话换标题？。系列定位输入：中文学习者会读简单单词；易混淆can的能力、否定与开窗请求；已有英语一句话三条目标稿。选题示范目标：01能力：我会游泳；02否定：不会就加can’t；03开窗：我来还是你来。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">三条选题各回答一个 can 问题</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="39" rx="4" fill="#784da0"/><path d="M77 168v12m-13 0h26" stroke="#784da0" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">系列定位输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">中文学习者会读简单单词</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">易混淆can的能力、否定</tspan><tspan x="64" dy="32.400000000000006">与开窗请求</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">已有英语一句话三条目标</tspan><tspan x="64" dy="32.400000000000006">稿</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">选题示范目标</tspan></text><rect x="425" y="172" width="525" height="248" rx="12" fill="#f4edfc" stroke="none"/><text x="449" y="211" font-size="27" fill="#784da0" font-weight="750"><tspan x="449" dy="0">教学示范：三条定位卡</tspan></text><text x="449" y="257" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">栏目：英语一句话｜观众：中文学习者</tspan></text><text x="449" y="307" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">01｜我会游泳怎么说？｜I can swim.</tspan></text><text x="449" y="357" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">02｜不会改哪里？｜I can’t swim.</tspan></text><text x="780" y="409" font-size="15" fill="#52677a" font-weight="500"><tspan x="780" dy="0">幻灯片内容示范</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>