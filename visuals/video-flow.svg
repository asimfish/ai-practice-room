<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 778" role="img"><title>短视频制作教学示意</title><rect width="420" height="778" rx="16" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="25" font-weight="700" fill="#182341">短视频制作</text><text x="24" y="69" font-size="16" fill="#59657e">原创教学图解 · 不是软件界面截图</text><rect x="24" y="92" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="122" r="15" fill="#244fe3"/><text x="50" y="128" text-anchor="middle" font-size="17" fill="white">1</text><text x="76" y="129" font-size="23" font-weight="700" fill="#182341">观众与一个问题</text><text x="42" y="160" font-size="24" fill="#59657e">只讲一个清楚的知识点</text><path d="M210 183v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="204" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="234" r="15" fill="#244fe3"/><text x="50" y="240" text-anchor="middle" font-size="17" fill="white">2</text><text x="76" y="241" font-size="23" font-weight="700" fill="#182341">口播稿</text><text x="42" y="272" font-size="24" fill="#59657e">人工核查，大声读计时</text><path d="M210 295v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="316" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="346" r="15" fill="#244fe3"/><text x="50" y="352" text-anchor="middle" font-size="17" fill="white">3</text><text x="76" y="353" font-size="23" font-weight="700" fill="#182341">分镜与素材</text><text x="42" y="384" font-size="24" fill="#59657e">时间、画面、来源</text><path d="M210 407v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="428" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="458" r="15" fill="#244fe3"/><text x="50" y="464" text-anchor="middle" font-size="17" fill="white">4</text><text x="76" y="465" font-size="23" font-weight="700" fill="#182341">必要的生成镜头</text><text x="42" y="496" font-size="24" fill="#59657e">先小测，限制重试</text><path d="M210 519v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="540" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="570" r="15" fill="#244fe3"/><text x="50" y="576" text-anchor="middle" font-size="17" fill="white">5</text><text x="76" y="577" font-size="23" font-weight="700" fill="#182341">剪辑、声音与字幕</text><text x="42" y="608" font-size="24" fill="#59657e">逐句校对，检查授权</text><path d="M210 631v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="652" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="682" r="15" fill="#244fe3"/><text x="50" y="688" text-anchor="middle" font-size="17" fill="white">6</text><text x="76" y="689" font-size="23" font-weight="700" fill="#182341">发布与复盘</text><text x="42" y="720" font-size="24" fill="#59657e">AI声明，成本与下一次</text></g></svg>