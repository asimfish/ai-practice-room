<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">余额够，还要核次数、单位与报价</title><desc id="desc">四个模拟请求中，哪一个满足继续条件？。预算模拟输入：CSV总上限40，仅为练习单位；已花、排队保留额与下次报价分别列；最多2次；空报价保留未知。模拟判断结果：SIM-A余额26，可按模拟预算继续；SIM-B预算不足，SIM-C次数到限；SIM-D报价未知，停止并核对。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">余额够，还要核次数、单位与报价</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#784da0"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">预算模拟输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">CSV总上限40，仅为练习</tspan><tspan x="64" dy="32.400000000000006">单位</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">已花、排队保留额与下次</tspan><tspan x="64" dy="32.400000000000006">报价分别列</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">最多2次；空报价保留未</tspan><tspan x="64" dy="32.400000000000006">知</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">模拟判断结果</tspan></text><rect x="423" y="173" width="530" height="250" rx="8" fill="#f8fafc" stroke="#e0e7f0"/><rect x="425" y="175" width="525" height="38" rx="0" fill="#f4edfc" stroke="none"/><text x="437" y="201" font-size="18" fill="#784da0" font-weight="700"><tspan x="437" dy="0">A</tspan></text><text x="564.5" y="201" font-size="18" fill="#784da0" font-weight="700"><tspan x="564.5" dy="0">40−8−6＝2</tspan><tspan x="564.5" dy="24.3">6</tspan></text><text x="692" y="201" font-size="18" fill="#784da0" font-weight="700"><tspan x="692" dy="0">下次7，已1/</tspan><tspan x="692" dy="24.3">2次</tspan></text><text x="819.5" y="201" font-size="18" fill="#784da0" font-weight="700"><tspan x="819.5" dy="0">模拟READY</tspan></text><rect x="425" y="215" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="241" font-size="18" fill="#263e52" font-weight="500"><tspan x="437" dy="0">B</tspan></text><text x="564.5" y="241" font-size="18" fill="#263e52" font-weight="500"><tspan x="564.5" dy="0">40−38−0＝</tspan><tspan x="564.5" dy="24.3">2</tspan></text><text x="692" y="241" font-size="18" fill="#263e52" font-weight="500"><tspan x="692" dy="0">下次4，已1/</tspan><tspan x="692" dy="24.3">2次</tspan></text><text x="819.5" y="241" font-size="18" fill="#263e52" font-weight="500"><tspan x="819.5" dy="0">STOP：不足</tspan></text><rect x="425" y="255" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="281" font-size="18" fill="#263e52" font-weight="500"><tspan x="437" dy="0">C</tspan></text><text x="564.5" y="281" font-size="18" fill="#263e52" font-weight="500"><tspan x="564.5" dy="0">40−8−0＝3</tspan><tspan x="564.5" dy="24.3">2</tspan></text><text x="692" y="281" font-size="18" fill="#263e52" font-weight="500"><tspan x="692" dy="0">下次5，已2/</tspan><tspan x="692" dy="24.3">2次</tspan></text><text x="819.5" y="281" font-size="18" fill="#263e52" font-weight="500"><tspan x="819.5" dy="0">STOP：到限</tspan></text><rect x="425" y="295" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="321" font-size="18" fill="#263e52" font-weight="500"><tspan x="437" dy="0">D</tspan></text><text x="564.5" y="321" font-size="18" fill="#263e52" font-weight="500"><tspan x="564.5" dy="0">40−8−0＝3</tspan><tspan x="564.5" dy="24.3">2</tspan></text><text x="692" y="321" font-size="18" fill="#263e52" font-weight="500"><tspan x="692" dy="0">下次报价空白</tspan></text><text x="819.5" y="321" font-size="18" fill="#263e52" font-weight="500"><tspan x="819.5" dy="0">STOP：未知</tspan></text><rect x="425" y="335" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="436" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">状态SIMULATED；单位为练习单位，非产品价格</tspan></text><rect x="425" y="375" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="436" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">本人真实报价、账单、退款与人工分钟分别另记</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>