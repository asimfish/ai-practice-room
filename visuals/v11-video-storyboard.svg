<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">50秒六镜：台词与画面逐段对齐</title><desc id="desc">每段画面具体解释哪一句，时间是否接得上？。分镜的输入：已核对的 borrow/lend 台词；原创卡片与本人拍摄的笔；材料CSV的六段起止时间。分镜示范目标：0–50秒连续六镜；每镜有台词、用途与来源；先粗排，动态镜头按需小试。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">50秒六镜：台词与画面逐段对齐</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="58" height="43" rx="7" fill="#784da0"/><path d="M71 140l17 12-17 12z" fill="white"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">分镜的输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">已核对的 borrow/lend</tspan><tspan x="64" dy="32.400000000000006"> 台词</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">原创卡片与本人拍摄的笔</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">材料CSV的六段起止时间</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">分镜示范目标</tspan></text><rect x="425" y="177" width="164" height="154" rx="8" fill="#f4edfc" stroke="none"/><path d="M437 315l48-40 34 25 3