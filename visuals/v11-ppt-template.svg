<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">沿用四页模板，填入社区电脑课</title><desc id="desc">填了具体内容后，原结构和可编辑性是否保留？。已有文件与事实：四页16:9原创PPTX与社区课简报；2026-11-06，14:00–15:00，晨光教室；保留深蓝标题和页面区域；替换占位文字。教学示范·四页已填内容：封面、三个目标、60分钟安排、课后练习；首稿community-class-v1.pptx与page-map；v2只改第三页指定句；模板和v1保留。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#fff1e5" stroke="none"/><text x="30" y="52" font-size="32" fill="#aa5728" font-weight="750"><tspan x="30" dy="0">沿用四页模板，填入社区电脑课</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="39" rx="4" fill="#aa5728"/><path d="M77 168v12m-13 0h26" stroke="#aa5728" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#aa5728" font-weight="700"><tspan x="120" dy="0">已有文件与事实</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">四页16:9原创PPTX与社</tspan><tspan x="64" dy="32.400000000000006">区课简报</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">2026-11-06，14:00–1</tspan><tspan x="64" dy="32.400000000000006">5:00，晨光教室</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">保留深蓝标题和页面区域</tspan><tspan x="64" dy="32.400000000000006">；替换占位文字</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#aa5728" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#aa5728" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·四页已填内容</tspan></text><rect x="425" y="172" width="525" height="248" rx="12" fill="#fff1e5" stroke="none"/><text x="449" y="211" font-size="27" fill="#aa5728" font-weight="750"><tspan x="449" dy="0">教学示范·第2/3/4页填入后的内容</tspan></text><text x="449" y="257" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">第2页标题：今天能做到三件事</tspan></text><text x="449" y="307" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">三块正文：创建文件夹｜保存并找到文件｜</tspan><tspan x="449" dy="32.400000000000006">修改文件名</tspan></text><text x="449" y="357" font-size="24" fill="#263e52" font-weight="500"><tspan x="449" dy="0">第3页：14:00–14:10认识文件夹；14:10</tspan><tspan x="449" dy="32.400000000000006">–14:35保存与改名</tspan></text><text x="780" y="409" font-size="15" fill="#52677a" font-weight="500"><tspan x="780" dy="0">幻灯片内容示范</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#aa5728" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>