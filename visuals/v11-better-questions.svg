<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同一份活动资料，提问越改越具体</title><desc id="desc">背景、限制与格式怎样改变通知初稿？。保持相同事实：AI学习成果分享，8位成人；社区活动室，每人预算20元；报名截止和联系人未提供。两轮更具体的要求：v1：200字内，时间地点齐全；v2：温和表达，列准备物品；v3：未知项单列，事实不变。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#edf2ff" stroke="none"/><text x="30" y="52" font-size="32" fill="#244fe3" font-weight="750"><tspan x="30" dy="0">同一份活动资料，提问越改越具体</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 127h52v34h-30l-15 12v-12h-7z" fill="#244fe3"/><circle cx="61" cy="144" r="3" fill="white"/><circle cx="74" cy="144" r="3" fill="white"/><circle cx="87" cy="144" r="3" fill="white"/><text x="120" y="153" font-size="25" fill="#244fe3" font-weight="700"><tspan x="120" dy="0">保持相同事实</tspan></text><rect x="47" y="183" width="290" height="225" rx="15" fill="#edf2ff" stroke="none"/><text x="63" y="219" font-size="24" fill="#263e52" font-weight="500"><tspan x="63" dy="0">AI学习成果分享，8位成</tspan><tspan x="63" dy="32.400000000000006">人</tspan></text><text x="63" y="286" font-size="24" fill="#263e52" font-weight="500"><tspan x="63" dy="0">社区活动室，每人预算2</tspan><tspan x="63" dy="32.400000000000006">0元</tspan></text><text x="63" y="353" font-size="24" fill="#263e52" font-weight="500"><tspan x="63" dy="0">报名截止和联系人未提供</tspan></text><path d="M61 408v15l22-15z" fill="#edf2ff"/><path d="M372 262h22m-8-8l8 8-8 8" stroke="#244fe3" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#244fe3" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">两轮更具体的要求</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#edf2ff" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">v1：200字内，时间地点齐全</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">v2：温和表达，列准备物品</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">v3：未知项单列，事实不变</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#244fe3" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>