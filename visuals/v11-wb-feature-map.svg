<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">Ask、Plan与执行分别看什么</title><desc id="desc">当前阶段需要理解材料、审核方案，还是生成文件？。一套备课材料：虚构学生A，10岁，40分钟能力课；英语练习包＋三页可编辑PPT参考；只在自己选择的练习工作空间使用。教学示范·功能与交付地图：Ask复述：目标、词表、原题1/3/5；Plan列出Word和三页PPT结构及检查；执行需实际文件技能；路径与结果待验证。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf1fc" stroke="none"/><text x="30" y="52" font-size="32" fill="#315e9e" font-weight="750"><tspan x="30" dy="0">Ask、Plan与执行分别看什么</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="45" rx="5" fill="#315e9e"/><path d="M69 129v45m0-23h37" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#315e9e" font-weight="700"><tspan x="120" dy="0">一套备课材料</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">虚构学生A，10岁，40分</tspan><tspan x="64" dy="32.400000000000006">钟能力课</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">英语练习包＋三页可编辑</tspan><tspan x="64" dy="32.400000000000006">PPT参考</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">只在自己选择的练习工作</tspan><tspan x="64" dy="32.400000000000006">空间使用</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#315e9e" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#315e9e" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·功能与交付地图</tspan></text><rect x="423" y="174" width="530" height="238" rx="10" fill="#23374d" stroke="none"/><rect x="435" y="189" width="157" height="200" rx="6" fill="#f9fcff" stroke="none"/><text x="448" y="217" font-size="22" fill="#315e9e" font-weight="700"><tspan x="448" dy="0">对话</tspan></text><text x="447" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="447" dy="0">Ask复述：目</tspan><tspan x="447" dy="28.35">标、词表、原</tspan><tspan x="447" dy="28.35">题1/3/5</tspan></text><rect x="605" y="189" width="157" height="200" rx="6" fill="#eaf1fb" stroke="none"/><text x="618" y="217" font-size="22" fill="#315e9e" font-weight="700"><tspan x="618" dy="0">文件</tspan></text><text x="617" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="617" dy="0">Plan列出Wor</tspan><tspan x="617" dy="28.35">d和三页PPT</tspan><tspan x="617" dy="28.35">结构及检查</tspan></text><rect x="775" y="189" width="157" height="200" rx="6" fill="#e3edf5" stroke="none"/><text x="788" y="217" font-size="22" fill="#315e9e" font-weight="700"><tspan x="788" dy="0">执行</tspan></text><text x="787" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="787" dy="0">执行需实际文</tspan><tspan x="787" dy="28.35">件技能；路径</tspan><tspan x="787" dy="28.35">与结果待验证</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#315e9e" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>