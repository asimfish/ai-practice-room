<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同输入比两稿，先查事实再看便利</title><desc id="desc">通知写得流畅，是否就比另一稿更可靠？。固定比较条件：同一活动资料、同一200字要求；两个新对话或两个已可用工具；先定时间、地点、未知项标准。自己的比较记录：准确性：逐条回原文核查；修改便利：记录具体返工；耗时与费用：有证据才填写。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#edf2ff" stroke="none"/><text x="30" y="52" font-size="32" fill="#244fe3" font-weight="750"><tspan x="30" dy="0">同输入比两稿，先查事实再看便利</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#244fe3"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#244fe3" font-weight="700"><tspan x="120" dy="0">固定比较条件</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">同一活动资料、同一200</tspan><tspan x="64" dy="32.400000000000006">字要求</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">两个新对话或两个已可用</tspan><tspan x="64" dy="32.400000000000006">工具</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">先定时间、地点、未知项</tspan><tspan x="64" dy="32.400000000000006">标准</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#244fe3" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#244fe3" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">自己的比较记录</tspan></text><rect x="423" y="173" width="530" height="250" rx="8" fill="#f8fafc" stroke="#e0e7f0"/><rect x="425" y="175" width="525" height="38" rx="0" fill="#edf2ff" stroke="none"/><text x="437" y="201" font-size="22" fill="#244fe3" font-weight="700"><tspan x="437" dy="0">维度</tspan></text><text x="607" y="201" font-size="22" fill="#244fe3" font-weight="700"><tspan x="607" dy="0">候选A</tspan></text><text x="777" y="201" font-size="22" fill="#244fe3" font-weight="700"><tspan x="777" dy="0">候选B</tspan></text><rect x="425" y="215" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">时间</tspan></text><text x="607" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">15:00–17:00</tspan><tspan x="607" dy="29.700000000000003">，错</tspan></text><text x="777" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">14:00–16:00</tspan><tspan x="777" dy="29.700000000000003">，符合原文</tspan></text><rect x="425" y="255" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">联系人</tspan></text><text x="607" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">李老师，无依据</tspan></text><text x="777" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">待确认，符合未</tspan><tspan x="777" dy="29.700000000000003">知状态</tspan></text><rect x="425" y="295" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="437" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">修改便利</tspan></text><text x="607" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">待本人体验</tspan></text><text x="777" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">待本人体验</tspan></text><rect x="425" y="335" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">耗时／费用</tspan></text><text x="607" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="607" dy="0">未计时／未核实</tspan></text><text x="777" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="777" dy="0">未计时／未核实</tspan></text><rect x="425" y="375" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="436" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">示范仅演示比较判据，未运行两个外部工具。</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#244fe3" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>