<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">五项活动分类，先选可撤回的小试点</title><desc id="desc">哪个重复步骤规则最清楚、失败最容易恢复？。模拟一周活动：改名5个文件、统计次数；备课、写日报、付费购买；次数与耗时需标真实或模拟。选定一个试点：改名：先预览，副本小批执行；日报：先草稿，人工核查；付款：本人确认与操作。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf5ef" stroke="none"/><text x="30" y="52" font-size="32" fill="#326452" font-weight="750"><tspan x="30" dy="0">五项活动分类，先选可撤回的小试点</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#326452"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#326452" font-weight="700"><tspan x="120" dy="0">模拟一周活动</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">改名5个文件、统计次数</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">备课、写日报、付费购买</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">次数与耗时需标真实或模</tspan><tspan x="64" dy="32.400000000000006">拟</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#326452" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#326452" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">选定一个试点</tspan></text><rect x="423" y="173" width="530" height="250" rx="8" fill="#f8fafc" stroke="#e0e7f0"/>