<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="title desc">
<title id="title">Can与Can't：让图片支持同一个语言目标</title><desc id="desc">原创英语教学示范。小鸟会飞，鱼会游泳，鱼不会飞，兔子会跳。学生用已有词表看图说能力句；答案与教师判据另存。</desc>
<style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}.sentence{font-size:29px;font-weight:700;fill:#214d48}.label{font-size:19px;fill:#647b75}</style>
<rect width="1000" height="560" rx="20" fill="#e9f5ef"/>
<text x="32" y="48" font-size="31" font-weight="700" fill="#245f55">看图说一句，再换自己的词卡</text><text x="33" y="80" class="label">原创教学示意 · 同一词表：bird / fish / rabbit · can 后接动词原形</text>
<g transform="translate(30 103)"><rect width="450" height="185" rx="18" fill="white"/><circle cx="120" cy="59" r="24" fill="#ffdf89"/><path d="M73 81q49-44 94 0q-15 18-43 19z" fill="#f5b24c"/><path d="M78 78q-42-58-48-23q5 43 60 38M146 78q39-58 46-23q-7 40-56 38" fill="#da814b"/><path d="M157 71l27 8-24 9" fill="#dd7847"/><circle cx="152" cy="67" r="4" fill="#394b50"/><path d="M31 128q26-14 52 0t52 0" stroke="#c7dfd8" fill="none" stroke-width="3"/><text x="220" y="70" class="label">小鸟的动作</text><text x="220" y="115" class="sentence">A bird can fly.</text><text x="220" y="150" class="label">先看图，再独立说一句。</text></g>
<g transform="translate(520 103)"><rect width="450" height="185" rx="18" fill="white"/><path d="M28 92q73-88 148 0q-75 90-148 0z" fill="#64b4c9"/><path d="M161 88l37-36v76z" fill="#3a8fab"/><circle cx="58" cy="85" r="5" fill="#244f62"/><path d="M14 139q21-13 42 0t42 0t42 0t42 0" stroke="#81c5d8" fill="none" stroke-width="4"/><text x="220" y="70" class="label">鱼的动作</text><text x="220" y="115" class="sentence">A fish can swim.</text><text x="220" y="150" class="label">can + swim，不用swims。</text></g>
<g transform="translate(30 308)"><rect width="450" height="185" rx="18" fill="white"/><path d="M29 93q65-71 128 0q-63 72-128 0z" fill="#94bac5"/><path d="M145 92l38-31v62z" fill="#679ba9"/><circle cx="59" cy="87" r="5" fill="#355967"/><circle cx="105" cy="86" r="68" fill="none" stroke="#c58462" stroke-width="6"/><path d="M57 40l97 97" stroke="#c58462" stroke-width="6"/><text x="220" y="70" class="label">判断否定含义</text><text x="220" y="115" class="sentence">A fish can't fly.</text><text x="220" y="150" class="label">不会飞，保留can't。</text></g>
<g transform="translate(520 308)"><rect width="450" height="185" rx="18" fill="white"/><ellipse cx="114" cy="97" rx="44" ry="31" fill="#e6d6c9"/><ellipse cx="151" cy="70" rx="25" ry="23" fill="#e6d6c9"/><ellipse cx="146" cy="37" rx="10" ry="29" fill="#e6d6c9"/><ellipse cx="164" cy="35" rx="9" ry="29" fill="#e6d6c9"/><circle cx="160" cy="67" r="4" fill="#4d4b4b"/><circle cx="71" cy="98" r="14" fill="#efebe7"/><path d="M80 139q59-29 117 0" stroke="#9cbaab" stroke-width="3" fill="none"/><path d="M124 126l-16 14m44-27l24 18" stroke="#c0a995" stroke-width="8" stroke-linecap="round"/><text x="220" y="70" class="label">换图复用同一句框</text><text x="220" y="115" class="sentence">A rabbit can jump.</text><text x="220" y="150" class="label">学生先答，教师再核对。</text></g>
<text x="32" y="535" class="label">这不是课堂实测结果。教师按学生水平选择词卡与支持程度；学生版不附答案。</text>
</svg>
