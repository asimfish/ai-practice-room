<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">资料到PPT：四步各留一份交接文件</title><desc id="desc">发现PPT人数错误时，应该回到哪一步修？。固定原始材料：活动资料：8人、每人20元；报名和联系人尚未提供；四段各约定输入与输出。可定位的四段流程：要点.md → 大纲.md → 稿件.pptx；检查.md记录问题与来源位置；事实错回材料，版式错回制作。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f0edfb" stroke="none"/><text x="30" y="52" font-size="32" fill="#6650ae" font-weight="750"><tspan x="30" dy="0">资料到PPT：四步各留一份交接文件</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#6650ae"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#6650ae" font-weight="700"><tspan x="120" dy="0">固定原始材料</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">活动资料：8人、每人20</tspan><tspan x="64" dy="32.400000000000006">元</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">报名和联系人尚未提供</tspan></text><text x="64" y="355.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">四段各约定输入与输出</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6650ae" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6650ae" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">可定位的四段流程</tspan></text><circle cx="490.75" cy="228" r="31" fill="#6650ae"/><text x="482.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="482.75" dy="0">1</tspan></text><text x="435" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="435" dy="0">列四段职责</tspan></text><path d="M544.5 228h28m-9-8l9 8-9 8" stroke="#6650ae" stroke-width="3" fill="none"/><circle cx="618.25" cy="228" r="31" fill="#6650ae"/><text x="610.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="610.25" dy="0">2</tspan></text><text x="562.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="562.5" dy="0">定义大纲字</tspan><tspan x="562.5" dy="32.400000000000006">段</tspan></text><path d="M672 228h28m-9-8l9 8-9 8" stroke="#6650ae" stroke-width="3" fill="none"/><circle cx="745.75" cy="228" r="31" fill="#6650ae"/><text x="737.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="737.75" dy="0">3</tspan></text><text x="690" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="690" dy="0">逐段检查文</tspan><tspan x="690" dy="32.400000000000006">件</tspan></text><path d="M799.5 228h28m-9-8l9 8-9 8" stroke="#6650ae" stroke-width="3" fill="none"/><circle cx="873.25" cy="228" r="31" fill="#6650ae"/><text x="865.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="865.25" dy="0">4</tspan></text><text x="817.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="817.5" dy="0">选择回退点</tspan></text><text x="438" y="397" font-size="23" fill="#6650ae" font-weight="600"><tspan x="438" dy="0">要点.md → 大纲.md → 稿件.pptx</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6650ae" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>