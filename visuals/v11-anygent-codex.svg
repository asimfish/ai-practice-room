<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同一电脑与目录，先只读再生成提纲</title><desc id="desc">怎样证明这段会话确实在自己的练习目录工作？。会话身份与输入：自己的在线电脑和真实Workspace；本人独立Codex认证配置；教案-v1.md：can/can’t练习。只读核对与新提纲：目标、已学词、下一轮修改三项；教案提纲-v1.md另存新文件；机器、目录、会话、路径可找回。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf2ff" stroke="none"/><text x="30" y="52" font-size="32" fill="#255ba1" font-weight="750"><tspan x="30" dy="0">同一电脑与目录，先只读再生成提纲</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 131h21l7 9h30v34h-58z" fill="#255ba1"/><path d="M57 150h39m-39 10h30" stroke="white" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#255ba1" font-weight="700"><tspan x="120" dy="0">会话身份与输入</tspan></text><path d="M64 195v183m0-140h20m-20 70h20m-20 70h20" stroke="#255ba1" stroke-width="3" fill="none"/><text x="90" y="221" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">自己的在线电脑和真实</tspan><tspan x="90" dy="32.400000000000006">Workspace</tspan></text><text x="90" y="289.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">本人独立Codex认证配</tspan><tspan x="90" dy="32.400000000000006">置</tspan></text><text x="90" y="358.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">教案-v1.md：can/</tspan><tspan x="90" dy="32.400000000000006">can’t练习</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#255ba1" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#255ba1" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">只读核对与新提纲</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#eaf2ff" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">目标、已学词、下一轮修改三项</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">教案提纲-v1.md另存新文件</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">机器、目录、会话、路径可找回</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#255ba1" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>