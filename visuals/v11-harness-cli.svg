<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">终端路线：版本、实际地址、工作区与停止</title><desc id="desc">本地页面能打开之后，为什么还不能算文件任务通过？。电脑端终端选修：Node与npx版本检查先通过；官方包名与当前本地地址；本人API额度与Key保管方式。一次本地任务记录：服务保持运行，选练习工作区；真实小文件可读取与打开；结束任务并知道停止服务。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eff1f6" stroke="none"/><text x="30" y="52" font-size="32" fill="#596078" font-weight="750"><tspan x="30" dy="0">终端路线：版本、实际地址、工作区与停止</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#596078"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#596078" font-weight="700"><tspan x="120" dy="0">电脑端终端选修</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">Node与npx版本检查先通</tspan><tspan x="64" dy="32.400000000000006">过</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">官方包名与当前本地地址</tspan></text><text x="64" y="355.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">本人API额度与Key保管</tspan><tspan x="64" dy="32.400000000000006">方式</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#596078" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#596078" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">一次本地任务记录</tspan></text><circle cx="490.75" cy="228" r="31" fill="#596078"/><text x="482.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="482.75" dy="0">1</tspan></text><text x="435" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="435" dy="0">检查版本</tspan></text><path d="M544.5 228h28m-9-8l9 8-9 8" stroke="#596078" stroke-width="3" fill="none"/><circle cx="618.25" cy="228" r="31" fill="#596078"/><text x="610.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="610.25" dy="0">2</tspan></text><text x="562.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="562.5" dy="0">读实际地址</tspan></text><path d="M672 228h28m-9-8l9 8-9 8" stroke="#596078" stroke-width="3" fill="none"/><circle cx="745.75" cy="228" r="31" fill="#596078"/><text x="737.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="737.75" dy="0">3</tspan></text><text x="690" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="690" dy="0">核额度与目</tspan><tspan x="690" dy="32.400000000000006">录</tspan></text><path d="M799.5 228h28m-9-8l9 8-9 8" stroke="#596078" stroke-width="3" fill="none"/><circle cx="873.25" cy="228" r="31" fill="#596078"/><text x="865.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="865.25" dy="0">4</tspan></text><text x="817.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="817.5" dy="0">验文件并停</tspan><tspan x="817.5" dy="32.400000000000006">止</tspan></text><text x="438" y="397" font-size="23" fill="#596078" font-weight="600"><tspan x="438" dy="0">服务保持运行，选练习工作区</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#596078" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>