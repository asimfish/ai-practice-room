<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">从模拟用量算到单次与三次成本</title><desc id="desc">0.004元来自哪两项，未知费用为什么不能填0？。CSV教学假设：输入1000，输出500 token；每百万输入2元、输出4元；完整重复3次；无缓存。可复算的模拟费用：输入0.002元＋输出0.002元；单次0.004元；三次0.012元；实际扣费无记录：未核实。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf5ef" stroke="none"/><text x="30" y="52" font-size="32" fill="#326452" font-weight="750"><tspan x="30" dy="0">从模拟用量算到单次与三次成本</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#326452"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#326452" font-weight="700"><tspan x="120" dy="0">CSV教学假设</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">输入1000，输出500 </tspan><tspan x="64" dy="32.400000000000006">token</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">每百万输入2元、输出4</tspan><tspan x="64" dy="32.400000000000006">元</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">完整重复3次；无缓存</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#326452" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#326452" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">可复算的模拟费用</tspan></text><rect x=