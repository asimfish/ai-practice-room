<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">社区电脑入门课：60分钟安排</title><desc id="desc">课程安排14:00–14:10认识练习文件夹、14:10–14:35保存与改名、14:35–15:00找回文件并互查。长度按10、25、25分钟编码。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect width="960" height="540" fill="#f5f7fb"/><rect width="18" height="540" fill="#1e4392"/><text x="55" y="88" font-size="40" fill="#183b84" font-weight="750">把60分钟分给三个动作</text><text x="56" y="132" font-size="23" fill="#647994" font-weight="500">时间按10＋25＋25分钟安排，实际教学可调整</text><rect x="54" y="186" width="143" height="88" rx="10" fill="#1e4392"/><rect x="201" y="186" width="356" height="88" rx="10" fill="#557ab9"/><rect x="561" y="186" width="356" height="88" rx="10" fill="#dca662"/><text x="75" y="239" font-size="25" fill="white" font-weight="700">10分钟</text><text x="319" y="239" font-size="29" fill="white" font-weight="700">25分钟</text><text x="676" y="239" font-size="29" fill="#4c391e" font-weight="700">25分钟</text><text x="54" y="308" font-size="21" fill="#203a61" font-weight="500">14:00</text><text x="188" y="308" font-size="21" fill="#203a61" font-weight="500">14:10</text><text x="541" y="308" font-size="21" fill="#203a61" font-weight="500">14:35</text><text x="849" y="308" font-size="21" fill="#203a61" font-weight="500">15:00</text><text x="57" y="377" font-size="23" fill="#203a61" font-weight="500">认识练习文件夹</text><text x="318" y="377" font-size="27" fill="#203a61" font-weight="500">保存与改名</text><text x="622" y="377" font-size="27" fill="#203a61" font-weight="500">找回文件并互查</text><text x="54" y="513" font-size="17" fill="#687994" font-weight="500">社区电脑入门课 · 原创版面示范，非实际PPTX渲染</text><text x="855" y="513" font-size="19" fill="#687994" font-weight="500">3 / 4</text></svg>