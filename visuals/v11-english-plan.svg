<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">40分钟教案与原题1/3/5退出票</title><desc id="desc">每个环节是否支持说3句能力表达？。课前输入：学生A与已学动物、动作词；5题题库仅选原题1/3/5作退出票；纸、彩笔、词卡；目标说3句。教学示范·40分钟骨架：热身5＋示范8＋引导10＋任务12＋退票5；每环节有教师话术、学生动作和达标信号；学生退出票无答案；教师稿另存答案。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#e8f5f0" stroke="none"/><text x="30" y="52" font-size="32" fill="#34746d" font-weight="750"><tspan x="30" dy="0">40分钟教案与原题1/3/5退出票</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="58" height="43" rx="7" fill="#34746d"/><path d="M71 140l17 12-17 12z" fill="white"/><text x="120" y="153" font-size="25" fill="#34746d" font-weight="700"><tspan x="120" dy="0">课前输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">学生A与已学动物、动作</tspan><tspan x="64" dy="32.400000000000006">词</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">5题题库仅选原题1/3/5</tspan><tspan x="64" dy="32.400000000000006">作退出票</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">纸、彩笔、词卡；目标说</tspan><tspan x="64" dy="32.400000000000006">3句</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#34746d" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#34746d" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·40分钟骨架</tspan></text><text x="431" y="201" font-size="28" fill="#34746d" font-weight="700"><tspan x="431" dy="0">40分钟 · 五个课堂环节</tspan></text><rect x="430" y="231" width="62" height="64" rx="7" fill="#34746d" stroke="none"/><text x="437" y="270" font-size="23" fill="#fff" font-weight="700"><tspan x="437" dy="0">热身</tspan></text><text x="430" y="320" font-size="20" fill="#536b7f" font-weight="500"><tspan x="430" dy="0">0</tspan></text><rect x="495" y="231" width="101" height="64" rx="7" fill="#e8f5f0" stroke="none"/><text x="502" y="270" font-size="23" fill="#34746d" font-weight="700"><tspan x="502" dy="0">示范</tspan></text><text x="495" y="320" font-size="20" fill="#536b7f" font-weight="500"><tspan x="495" dy="0">5</tspan></text><rect x="599" y="231" width="127" height="64" rx="7" fill="#34746d" stroke="none"/><text x="606" y="270" font-size="23" fill="#fff" font-weight="700"><tspan x="606" dy="0">引导</tspan></text><text x="599" y="320" font-size="20" fill="#536b7f" font-weight="500"><tspan x="599" dy="0">13</tspan></text><rect x="729" y="231" width="153" height="64" rx="7" fill="#e8f5f0" stroke="none"/><text x="736" y="270" font-size="23" fill="#34746d" font-weight="700"><tspan x="736" dy="0">说句</tspan></text><text x="729" y="320" font-size="20" fill="#536b7f" font-weight="500"><tspan x="729" dy="0">23</tspan></text><rect x="885" y="231" width="62" height="64" rx="7" fill="#34746d" stroke="none"/><text x="892" y="270" font-size="23" fill="#fff" font-weight="700"><tspan x="892" dy="0">退票</tspan></text><text x="885" y="320" font-size="20" fill="#536b7f" font-weight="500"><tspan x="885" dy="0">35</tspan></text><text x="933" y="320" font-size="20" fill="#536b7f" font-weight="500"><tspan x="933" dy="0">40</tspan></text><text x="432" y="354" font-size="20" fill="#536b7f" font-weight="500"><tspan x="432" dy="0">分钟（示例计划，可按实际学生调整）</tspan></text><text x="432" y="402" font-size="22" fill="#34746d" font-weight="600"><tspan x="432" dy="0">每个环节：教师动作 → 学生动作 → 达标信号</tspan></text><rect x="28" y="4