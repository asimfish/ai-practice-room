<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">三集承接：从告别到先问，再到约定</title><desc id="desc">第二三集是否承接已发生的行为，并产生新变化？。系列承接输入：同一个傍晚，同一柜台与闭合旧书；固定角色、服装、声音与男左女右；三份完整设计稿，真实成片未执行。系列示范目标：EP01面对告别；EP02先问需要；EP03把大承诺改成周六四点小约定；三集动态作品逐集审片与独立状态。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">三集承接：从告别到先问，再到约定</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="39" rx="4" fill="#784da0"/><path d="M77 168v12m-13 0h26" stroke="#784da0" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">系列承接输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">同一个傍晚，同一柜台与</tspan><tspan x="64" dy="32.400000000000006">闭合旧书</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">固定角色、服装、声音与</tspan><tspan x="64" dy="32.400000000000006">男左女右</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">三份完整设计稿，真实成</tspan><tspan x="64" dy="32.400000000000006">片未执行</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">系列示范目标</tspan></text><rect x="425" y="172" width="525" height="248" rx="12" fill="#f4edfc" stroke="none"/><text x="449" y="211" font-size="27" fill="#784da0" font-weight="750"><tspan x="449" dy="0">系列示范目标</tspan></text><text x="449" y="251" font-size="22" fill="#263e52" font-weight="500"><tspan x="449" dy="0">EP01面对告别；EP02先问需要</tspan></text><text x="449" y="318" font-size="22" fill="#263e52" font-weight="500"><tspan x="449" dy="0">EP03把大承诺改成周六四点小约定</tspan></text><text x="449" y="385" font-size="22" fill="#263e52" font-weight="500"><tspan x="449" dy="0">三集动态作品逐集审片与独立状态</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>