<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470"><rect width="1280" height="470" rx="22" fill="#f2f5fc"/><g font-family="Arial,Microsoft YaHei,PingFang SC,sans-serif"><text x="44" y="56" font-size="27" font-weight="700" fill="#20365a">把任务交给真实Agent，检查实际文件后再修改</text><text x="44" y="92" font-size="18" fill="#566781">流程示意 · 网站整理任务，执行在本人电脑和账号中完成</text><g fill="white" stroke="#d3dded" stroke-width="2"><rect x="40" y="128" width="220" height="196" rx="18"/><rect x="360" y="128" width="220" height="196" rx="18"/><rect x="680" y="128" width="220" height="196" rx="18"/><rect x="1000" y="128" width="240" height="196" rx="18"/></g><g fill="#244fe3" font-size="30" font-weight="700"><text x="70" y="177">1</text><text x="390" y="177">2</text><text x="710" y="177">3</text><text x="1030" y="177">4</text><text x="292" y="245">→</text><text x="612" y="245">→</text><text x="932" y="245">→</text></g><g fill="#20365a" font-size="23" font-weight="700"><text x="70" y="214">自己的需求</text><text x="390" y="214">本地Agent</text><text x="710" y="214">实际工具</text><text x="1030" y="214">真实输出文件</text></g><g fill="#566781" font-size="18"><text x="70" y="251">主题、材料、限制</text><text x="70" y="282">保存任务并交给它</text><text x="390" y="251">读材料、执行、读回</text><text x="390" y="282">明确缺项与执行范围</text><text x="710" y="251">Skill／接口／剪辑</text><text x="710" y="282">记录真实结果与状态</text><text x="1030" y="251">PPTX／MP4／DOCX</text><text x="1030" y="282">本人打开、播放、核题</text></g><path d="M1120 342V385H470V342" fill="none" stroke="#34746d" stroke-width="3"/><path d="m461 353 9-13 9 13" fill="none" stroke="#34746d" stroke-width="3"/><rect x="604" y="365" width="365" height="38" rx="12" fill="#e2f1ea"/><text x="625" y="391" font-size="18" fill="#275d4a">具体反馈 → 修改文件 → 核对新版</text><text x="44" y="440" font-size="17" fill="#566781">工具可见 ≠ 执行成功；任务编号 ≠ 视频完成；检查实际输出后才能继续。</text></g></svg>
