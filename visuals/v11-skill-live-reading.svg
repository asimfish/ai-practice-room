<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">刷新失败时，读清缓存、随站资料与时间</title><desc id="desc">当前列表从哪里来，搜索结果为什么不等于实时能力？。一次目录读取尝试：任务词：document；实时读取、上次缓存或随站资料；手动刷新有冷却与接口限制。带状态的发现记录：成功：记录本人获取时间；失败：保留错误和实际资料日期；候选原链接：再读完整说明。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f0edfb" stroke="none"/><text x="30" y="52" font-size="32" fill="#6650ae" font-weight="750"><tspan x="30" dy="0">刷新失败时，读清缓存、随站资料与时间</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="58" height="43" rx="7" fill="#6650ae"/><path d="M71 140l17 12-17 12z" fill="white"/><text x="120" y="153" font-size="25" fill="#6650ae" font-weight="700"><tspan x="120" dy="0">一次目录读取尝试</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">任务词：document</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">实时读取、上次缓存或随</tspan><tspan x="64" dy="32.400000000000006">站资料</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">手动刷新有冷却与接口限</tspan><tspan x="64" dy="32.400000000000006">制</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6650ae" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6650ae" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">带状态的发现记录</tspan></text><rect x="425" y="177" width="164" height="154" rx="8