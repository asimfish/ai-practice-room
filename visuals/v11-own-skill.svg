<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">英语检查规则，用T1、T2、T3分别试</title><desc id="desc">自写Skill怎样同时做到保留、纠错和先问缺项？。三份独立测试卡：T1：完整输入，I can jump.；T2：完整输入，I can jumps.；T3：有题目答案，只缺教学目标。三项测试预期：T1保留正确句；T2修成jump并解释原形；T3先问目标，不继承旧对话。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f1edff" stroke="none"/><text x="30" y="52" font-size="32" fill="#6355ba" font-weight="750"><tspan x="30" dy="0">英语检查规则，用T1、T2、T3分别试</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 131h21l7 9h30v34h-58z" fill="#6355ba"/><path d="M57 150h39m-39 10h30" stroke="white" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#6355ba" font-weight="700"><tspan x="120" dy="0">三份独立测试卡</tspan></text><path d="M64 195v183m0-140h20m-20 70h20m-20 70h20" stroke="#6355ba" stroke-width="3" fill="none"/><text x="90" y="221" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">T1：完整输入，I can</tspan><tspan x="90" dy="32.400000000000006"> jump.</tspan></text><text x="90" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">T2：完整输入，I can</tspan><tspan x="90" dy="32.400000000000006"> jumps.</tspan></text><text x="90" y="353" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">T3：有题目答案，只</tspan><tspan x="90" dy="32.400000000000006">缺教学目标</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6355ba" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6355ba" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">三项测试预期</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f1edff" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">T1保留正确句</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">T2修成jump并解释原形</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">T3先问目标，不继承旧对话</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6355ba" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>