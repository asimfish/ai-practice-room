<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">换新故事做小范围测试，再故意缺一项</title><desc id="desc">这份制作说明能复用，也能在缺授权时停下吗？。复用规则输入：已实际制作与审片的原作品；三条规则及原片时间码例子；新故事、角色、允许素材与预算。迁移示范目标：一个真实可播放的新故事测试片段；缺来源/音色说明时停止的测试；亲友复做状态与规则修订记录。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">换新故事做小范围测试，再故意缺一项</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 131h21l7 9h30v34h-58z" fill="#784da0"/><path d="M57 150h39m-39 10h30" stroke="white" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">复用规则输入</tspan></text><path d="M64 195v183m0-140h20m-20 70h20m-20 70h20" stroke="#784da0" stroke-width="3" fill="none"/><text x="90" y="221" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">已实际制作与审片的原</tspan><tspan x="90" dy="32.400000000000006">作品</tspan></text><text x="90" y="289.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">三条规则及原片时间码</tspan><tspan x="90" dy="32.400000000000006">例子</tspan></text><text x="90" y="358.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">新故事、角色、允许素</tspan><tspan x="90" dy="32.400000000000006">材与预算</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">迁移示范目标</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f4edfc" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">一个真实可播放的新故事测试片段</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">缺来源/音色说明时停止的测试</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">亲友复做状态与规则修订记录</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>