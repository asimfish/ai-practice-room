<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同一主体：固定特征逐镜头核对</title><desc id="desc">三个镜头中仍然是同一个主体吗？。主体资产输入：本人自制或有权使用的主体参考；系列几何角色：圆头、青绿衣、左手卡；固定项与允许变化项分开写。资产包示范目标：清楚的母图与来源记录；三镜首/中/尾逐项比对；错误镜号、特征与修改记录。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">同一主体：固定特征逐镜头核对</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="129" width="58" height="45" rx="5" fill="#784da0"/><path d="M69 129v45m0-23h37" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">主体资产输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">本人自制或有权使用的主</tspan><tspan x="64" dy="32.400000000000006">体参考</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">系列几何角色：圆头、青</tspan><tspan x="64" dy="32.400000000000006">绿衣、左手卡</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">固定项与允许变化项分开</tspan><tspan x="64" dy="32.400000000000006">写</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">资产包示范目标</tspan></text><rect x="423" y="174" width="530" height="238" rx="10" fill="#23374d" stroke="none"/><rect x="435" y="189" width="157" height="200" rx="6" fill="#f9fcff" stroke="none"/><text x="448" y="217" font-size="22" fill="#784da0" font-weight="700"><tspan x="448" dy="0">对话</tspan></text><text x="447" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="447" dy="0">清楚的母图与</tspan><tspan x="447" dy="28.35">来源记录</tspan></text><rect x="605" y="189" width="157" height="200" rx="6" fill="#eaf1fb" stroke="none"/><text x="618" y="217" font-size="22" fill="#784da0" font-weight="700"><tspan x="618" dy="0">文件</tspan></text><text x="617" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="617" dy="0">三镜首/中/</tspan><tspan x="617" dy="28.35">尾逐项比对</tspan></text><rect x="775" y="189" width="157" height="200" rx="6" fill="#e3edf5" stroke="none"/><text x="788" y="217" font-size="22" fill="#784da0" font-weight="700"><tspan x="788" dy="0">执行</tspan></text><text x="787" y="261" font-size="21" fill="#263e52" font-weight="500"><tspan x="787" dy="0">错误镜号、特</tspan><tspan x="787" dy="28.35">征与修改记录</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>