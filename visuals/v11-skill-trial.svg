<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">新Skill小试：先读范围，再看真实结果</title><desc id="desc">怎样留下可以判断保留或停用的试验记录？。一个写作检查候选：原项目：writing-guidelines；输入：T2夸大说明，虚构错例；目标宿主、路径与依赖先核。完整试验记录：来源、许可、规则与工具要求；是否触发、是否读到规则；实际建议、未知项和失败边界。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f0edfb" stroke="none"/><text x="30" y="52" font-size="32" fill="#6650ae" font-weight="750"><tspan x="30" dy="0">新Skill小试：先读范围，再看真实结果</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 131h21l7 9h30v34h-58z" fill="#6650ae"/><path d="M57 150h39m-39 10h30" stroke="white" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#6650ae" font-weight="700"><tspan x="120" dy="0">一个写作检查候选</tspan></text><path d="M64 195v183m0-140h20m-20 70h20m-20 70h20" stroke="#6650ae" stroke-width="3" fill="none"/><text x="90" y="221" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">原项目：writing-</tspan><tspan x="90" dy="32.400000000000006">guidelines</tspan></text><text x="90" y="289.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">输入：T2夸大说明，</tspan><tspan x="90" dy="32.400000000000006">虚构错例</tspan></text><text x="90" y="358.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">目标宿主、路径与依赖</tspan><tspan x="90" dy="32.400000000000006">先核</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6650ae" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6650ae" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">完整试验记录</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f0edfb" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">来源、许可、规则与工具要求</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">是否触发、是否读到规则</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">实际建议、未知项和失败边界</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6650ae" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>