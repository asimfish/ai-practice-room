<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">把学生观察写成可检查的目标</title><desc id="desc">这份需求是否足够设计一节can/can’t课？。已有观察：虚构学生A，10岁，能读简单句；已学动物与fly/swim/jump/run；长句读得慢，喜欢画画；小班40分钟。教学示范·匿名需求单：目标：能说3句动物能力句；理解检查：完成5道can/can’t题；材料：纸、彩笔、词卡；难度由教师确认。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#e8f5f0" stroke="none"/><text x="30" y="52" font-size="32" fill="#34746d" font-weight="750"><tspan x="30" dy="0">把学生观察写成可检查的目标</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#34746d"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#34746d" font-weight="700"><tspan x="120" dy="0">已有观察</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">虚构学生A，10岁，能读</tspan><tspan x="64" dy="32.400000000000006">简单句</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">已学动物与fly/swim/</tspan><tspan x="64" dy="32.400000000000006">jump/run</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">长句读得慢，喜欢画画；</tspan><tspan x="64" dy="32.400000000000006">小班40分钟</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#34746d" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#34746d" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·匿名需求单</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#e8f5f0" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">目标：能说3句动物能力句</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">理解检查：完成5道can/can’t题</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">材料：纸、彩笔、词卡；难度由教师确认</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#34746d" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>