<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同一母版，两份发布包分别核对</title><desc id="desc">尺寸、许可和指标口径能直接跨平台搬用吗？。跨平台输入：自己的原始母版与项目；两个本人可用的平台；发布审核CSV：目前各平台均未发布。两版示范目标：分别检查封面裁切与字幕；逐项核素材是否允许本次平台用途；数据按平台原指标与同窗口记录。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">同一母版，两份发布包分别核对</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#784da0"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">跨平台输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">自己的原始母版与项目</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">两个本人可用的平台</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">发布审核CSV：目前各平</tspan><tspan x="64" dy="32.400000000000006">台均未发布</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">两版示范目标</tspan></text><rect x="423" y="173" width="530" height="250" rx="8" fill="#f8fafc" stroke="#e0e7f0"/><rect x="425" y="175" width="525" height="38" rx="0" fill="#f4edfc" stroke="none"/><text x="436" y="201" font-size="22" fill="#784da0" font-weight="700"><tspan x="436" dy="0">B站标题草稿：Can I 和 Can you 怎么选？</tspan></text><rect x="425" y="215" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="436" y="241" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">抖音标题草稿：我来还是你来？两句开窗英语</tspan></text><rect x="425" y="255" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="437" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="437" dy="0">两平台当前状态：未发布</tspan></text><text x="692" y="281" font-size="22" fill="#263e52" font-weight="500"><tspan x="692" dy="0">URL与发布时间空白</tspan></text><rect x="425" y="295" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="436" y="321" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">CSV模拟：片长30秒，同口径平均观看18秒</tspan></text><rect x="425" y="335" width="525" height="38" rx="0" fill="#f3f7fa" stroke="none"/><text x="436" y="361" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">18 ÷ 30 × 100% = 60%：平均观看时长占比</tspan></text><rect x="425" y="375" width="525" height="38" rx="0" fill="#fff" stroke="none"/><text x="436" y="401" font-size="22" fill="#263e52" font-weight="500"><tspan x="436" dy="0">真实播放、完播等：未获得，保留原字段</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>