<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 828" role="img"><title>练习文件目录示意</title><desc>本站原创教学示意，不是软件界面截图</desc><rect width="560" height="828" rx="20" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif" fill="#182341"><text x="26" y="48" font-size="28" fill="#182341" font-weight="700">把交付文件放在找得到的地方</text><text x="26" y="82" font-size="21" fill="#59657e" font-weight="400">原创目录示意 · 文件名由你确定</text><rect x="24" y="108" width="512" height="590" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="148" font-size="25" fill="#244fe3" font-weight="700">AI练习 /</text><text x="60" y="195" font-size="25" fill="#182341" font-weight="400">input / 原始材料副本</text><text x="78" y="242" font-size="25" fill="#182341" font-weight="400">brief.md · 目标和验收</text><text x="78" y="289" font-size="25" fill="#182341" font-weight="400">sales.csv · 虚构数据</text><text x="60" y="336" font-size="25" fill="#182341" font-weight="400">output / 真实成果</text><text x="78" y="383" font-size="25" fill="#182341" font-weight="400">v1 / 初稿</text><text x="78" y="430" font-size="25" fill="#182341" font-weight="400">v2 / 按反馈修订</text><text x="78" y="477" font-size="25" fill="#182341" font-weight="400">review.md · 检查记录</text><text x="60" y="524" font-size="25" fill="#182341" font-weight="400">log / 过程和费用</text><text x="78" y="571" font-size="25" fill="#182341" font-weight="400">changes.md · 改了哪里</text><text x="78" y="618" font-size="25" fill="#182341" font-weight="400">cost.csv · 重试与采用</text><text x="28" y="745" font-size="25" fill="#244fe3" font-weight="400">先对照文件清单，再打开成品检查</text><text x="28" y="788" font-size="23" fill="#59657e" font-weight="400">旧稿另存；“说完成”不等于真实交付</text></g></svg>