<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">社区电脑入门课：三个目标</title><desc id="desc">创建文件夹、保存并找到文件、修改文件名，三项可检查动作。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect width="960" height="540" fill="#f5f7fb"/><rect width="18" height="540" fill="#1e4392"/><text x="55" y="88" font-size="40" fill="#183b84" font-weight="750">今天做成这三件事</text><text x="56" y="132" font-size="23" fill="#647994" font-weight="500">能自己操作，也能向同伴解释</text><rect x="54" y="174" width="268" height="266" rx="16" fill="#fff"/><circle cx="105" cy="226" r="28" fill="#e8eef9"/><text x="96" y="237" font-size="30" fill="#274e91" font-weight="750">1</text><text x="77" y="297" font-size="27" fill="#203a61" font-weight="700">创建文件夹</text><text x="77" y="343" font-size="18" fill="#687994" font-weight="500">建立自己的练习位置</text><rect x="349" y="174" width="268" height="266" rx="16" fill="#fff"/><circle cx="400" cy="226" r="28" fill="#e8eef9"/><text x="391" y="237" font-size="30" fill="#274e91" font-weight="750">2</text><text x="372" y="297" font-size="27" fill="#203a61" font-weight="700">保存并找到文件</text><text x="372" y="343" font-size="18" fill="#687994" font-weight="500">确认文件真的在目标目录</text><rect x="644" y="174" width="268" height="266" rx="16" fill="#fff"/><circle cx="695" cy="226" r="28" fill="#e8eef9"/><text x="686" y="237" font-size="30" fill="#274e91" font-weight="750">3</text><text x="667" y="297" font-size="27" fill="#203a61" font-weight="700">修改文件名</text><text x="667" y="343" font-size="18" fill="#687994" font-weight="500">保留内容，核对新名称</text><text x="54" y="513" font-size="17" fill="#687994" font-weight="500">社区电脑入门课 · 原创版面示范，非实际PPTX渲染</text><text x="855" y="513" font-size="19" fill="#687994" font-weight="500">2 / 4</text></svg>