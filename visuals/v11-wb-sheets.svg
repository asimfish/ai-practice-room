<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">10行成绩保留缺失，再算7组成对</title><desc id="desc">重复和空白是否处理正确，平均提升能否复算？。原始10行CSV：S02,85,90完全重复出现两次；S03后测空白；S09前测空白；成绩单位为分；原始10行保留，先看预览。教学示范·清洗与成对汇总：清洗9个唯一编号；两处缺失保持空白；同一7人合计：前558、后595、提升37分；均值：前79.71、后85、提升约5.29分。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf1fc" stroke="none"/><text x="30" y="52" font-size="32" fill="#315e9e" font-weight="750"><tspan x="30" dy="0">10行成绩保留缺失，再算7组成对</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#315e9e"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#315e9e" font-weight="700"><tspan x="120" dy="0">原始10行CSV</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">S02,85,90完全重复出现</tspan><tspan x="64" dy="32.400000000000006">两次</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">S03后测空白；S09前测</tspan><tspan x="64" dy="32.400000000000006">空白</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">成绩单位为分；原始10</tspan><tspan x="64" dy="32.400000000000006">行保留，先看预览</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#315e9e" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#315e9e" stroke="none"/><text x="435" y="147" font-size="