<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 666" role="img"><title>人与AI协作教学示意</title><rect width="420" height="666" rx="16" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif"><text x="24" y="40" font-size="25" font-weight="700" fill="#182341">人与AI协作</text><text x="24" y="69" font-size="16" fill="#59657e">原创教学图解 · 不是软件界面截图</text><rect x="24" y="92" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="122" r="15" fill="#244fe3"/><text x="50" y="128" text-anchor="middle" font-size="17" fill="white">1</text><text x="76" y="129" font-size="23" font-weight="700" fill="#182341">人先理解</text><text x="42" y="160" font-size="24" fill="#59657e">对象、目标、已有材料</text><path d="M210 183v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="204" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="234" r="15" fill="#244fe3"/><text x="50" y="240" text-anchor="middle" font-size="17" fill="white">2</text><text x="76" y="241" font-size="23" font-weight="700" fill="#182341">写清要求</text><text x="42" y="272" font-size="24" fill="#59657e">好结果、反例、边界</text><path d="M210 295v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="316" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="346" r="15" fill="#244fe3"/><text x="50" y="352" text-anchor="middle" font-size="17" fill="white">3</text><text x="76" y="353" font-size="23" font-weight="700" fill="#182341">AI探索与执行</text><text x="42" y="384" font-size="24" fill="#59657e">先复述，再做小样</text><path d="M210 407v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="428" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="458" r="15" fill="#244fe3"/><text x="50" y="464" text-anchor="middle" font-size="17" fill="white">4</text><text x="76" y="465" font-size="23" font-weight="700" fill="#182341">人检查与反馈</text><text x="42" y="496" font-size="24" fill="#59657e">核对来源，解释取舍</text><path d="M210 519v13m-5-5 5 5 5-5" stroke="#7e94d2" stroke-width="2" fill="none"/><rect x="24" y="540" width="372" height="88" rx="10" fill="white" stroke="#d8e0f2"/><circle cx="50" cy="570" r="15" fill="#244fe3"/><text x="50" y="576" text-anchor="middle" font-size="17" fill="white">5</text><text x="76" y="577" font-size="23" font-weight="700" fill="#182341">更新自己的方法</text><text x="42" y="608" font-size="24" fill="#59657e">规则写入模板或Skill</text></g></svg>