<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">先画办公路线，再核Workspace与邀请</title><desc id="desc">邀请码、连接Token和本机执行分别是什么？。自己的办公路线：手机：操作入口；本人电脑：执行Codex任务；练习Workspace：存教案副本。接入与邀请记录：先核真实Workspace接入条件；课程码JMSY5HME按本人页面填写；邀请码可分享，凭据不可公开。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf2ff" stroke="none"/><text x="30" y="52" font-size="32" fill="#255ba1" font-weight="750"><tspan x="30" dy="0">先画办公路线，再核Workspace与邀请</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#255ba1"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#255ba1" font-weight="700"><tspan x="120" dy="0">自己的办公路线</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">手机：操作入口</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">本人电脑：执行Codex任</tspan><tspan x="64" dy="32.400000000000006">务</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">练习Workspace：存教案</tspan><tspan x="64" dy="32.400000000000006">副本</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#255ba1" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#255ba1" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">接入与邀请记录</tspan></text><circle cx="490.75" cy="228" r="31" fill="#255ba1"/><text x="482.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="482.75" dy="0">1</tspan></text><text x="435" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="435" dy="0">从官方指南</tspan><tspan x="435" dy="32.400000000000006">进</tspan></text><path d="M544.5 228h28m-9-8l9 8-9 8" stroke="#255ba1" stroke-width="3" fill="none"/><circle cx="618.25" cy="228" r="31" fill="#255ba1"/><text x="610.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="610.25" dy="0">2</tspan></text><text x="562.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="562.5" dy="0">先排接入任</tspan><tspan x="562.5" dy="32.400000000000006">务</tspan></text><path d="M672 228h28m-9-8l9 8-9 8" stroke="#255ba1" stroke-width="3" fill="none"/><circle cx="745.75" cy="228" r="31" fill="#255ba1"/><text x="737.75" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="737.75" dy="0">3</tspan></text><text x="690" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="690" dy="0">接入后核好</tspan><tspan x="690" dy="32.400000000000006">友码</tspan></text><path d="M799.5 228h28m-9-8l9 8-9 8" stroke="#255ba1" stroke-width="3" fill="none"/><circle cx="873.25" cy="228" r="31" fill="#255ba1"/><text x="865.25" y="238" font-size="26" fill="#fff" font-weight="750"><tspan x="865.25" dy="0">4</tspan></text><text x="817.5" y="290" font-size="24" fill="#263e52" font-weight="700"><tspan x="817.5" dy="0">记录路线区</tspan><tspan x="817.5" dy="32.400000000000006">别</tspan></text><text x="438" y="397" font-size="23" fill="#255ba1" font-weight="600"><tspan x="438" dy="0">先核真实Workspace接入条件</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#255ba1" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>