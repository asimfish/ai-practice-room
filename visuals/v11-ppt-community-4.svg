<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">社区电脑入门课：课后练习</title><desc id="desc">创建practice文件夹，保存notes.txt，将它改名为my-first-notes.txt，最后找回并检查。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect width="960" height="540" fill="#f5f7fb"/><rect width="18" height="540" fill="#1e4392"/><text x="55" y="88" font-size="36" fill="#183b84" font-weight="750">练习结束，留下一个可检查的文件</text><text x="56" y="132" font-size="23" fill="#647994" font-weight="500">用自己的目录复做，原文件另存副本</text><rect x="54" y="175" width="862" height="275" rx="16" fill="#fff"/><text x="81" y="236" font-size="31" fill="#1e4392" font-weight="750">1</text><text x="124" y="236" font-size="29" fill="#203a61" font-weight="500">创建 practice 文件夹</text><text x="81" y="307" font-size="31" fill="#1e4392" font-weight="750">2</text><text x="124" y="307" font-size="29" fill="#203a61" font-weight="500">保存 notes.txt</text><text x="81" y="378" font-size="31" fill="#1e4392" font-weight="750">3</text><text x="124" y="378" font-size="29" fill="#203a61" font-weight="500">改名为 my-first-notes.txt</text><path d="M617 217h56l16 18h165v168H617z" fill="#f0bf7a"/><rect x="680" y="257" width="113" height="108" rx="8" fill="#fff"/><path d="M701 285h70m-70 25h70m-70 25h45" stroke="#91a8c8" stroke-width="6"/><text x="54" y="513" font-size="17" fill="#687994" font-weight="500">社区电脑入门课 · 原创版面示范，非实际PPTX渲染</text><text x="855" y="513" font-size="19" fill="#687994" font-weight="500">4 / 4</text></svg>