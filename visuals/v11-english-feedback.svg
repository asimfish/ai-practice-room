<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">用原题3和5证据写具体反馈</title><desc id="desc">反馈是否指向作答证据，并给可观察的下一步？。完整5题虚构作答：原题1 swim、2 can、4兔子会跳；原题3写can；原题5写A cat can runs.；这是题库虚构作答，不是3题退票实测。教学示范·反馈与补救：具体肯定：动作词与原题4翻译正确；需要练：否定含义与can后动词原形；5分钟小检查后再判断原因。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#e8f5f0" stroke="none"/><text x="30" y="52" font-size="32" fill="#34746d" font-weight="750"><tspan x="30" dy="0">用原题3和5证据写具体反馈</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#34746d"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#34746d" font-weight="700"><tspan x="120" dy="0">完整5题虚构作答</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">原题1 swim、2 can、4</tspan><tspan x="64" dy="32.400000000000006">兔子会跳</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">原题3写can；原题5写A </tspan><tspan x="64" dy="32.400000000000006">cat can runs.</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">这是题库虚构作答，不是</tspan><tspan x="64" dy="32.400000000000006">3题退票实测</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#34746d" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#34746d" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·反馈与补救</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#e8f5f0" stroke="none"/><circle cx="454" cy="215" r="15" fill="#34746d"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">原题3正确为can’t，原题5改run</tspan></text><circle cx="454" cy="278" r="15" fill="#34746d"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">没有把一次表现写成诊断或标签</tspan></text><circle cx="454" cy="341" r="15" fill="#34746d"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">补救能观察肯定、否定和动词原形</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#34746d" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>