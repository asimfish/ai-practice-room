<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 880" role="img"><title>开源项目阅读地图</title><desc>本站原创教学示意，不是软件界面截图</desc><rect width="560" height="880" rx="20" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif" fill="#182341"><text x="28" y="48" font-size="30" fill="#182341" font-weight="700">怎样读一个开源项目</text><text x="28" y="82" font-size="21" fill="#59657e" font-weight="400">原创示意 · 按当前原仓库核对</text><rect x="24" y="108" width="512" height="128" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="146" font-size="25" fill="#244fe3" font-weight="700">README → 项目说明</text><text x="42" y="184" font-size="24" fill="#182341" font-weight="400">它解决什么任务？</text><text x="42" y="217" font-size="24" fill="#59657e" font-weight="400">支持什么宿主和设备？</text><rect x="24" y="256" width="512" height="128" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="294" font-size="25" fill="#244fe3" font-weight="700">LICENSE → 使用条件</text><text x="42" y="332" font-size="24" fill="#182341" font-weight="400">哪些目录有不同许可？</text><text x="42" y="365" font-size="24" fill="#59657e" font-weight="400">允许怎样用和分发？</text><rect x="24" y="404" width="512" height="128" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="442" font-size="25" fill="#244fe3" font-weight="700">SKILL.md → 工作方法</text><text x="42" y="480" font-size="24" fill="#182341" font-weight="400">什么时候触发？</text><text x="42" y="513" font-size="24" fill="#59657e" font-weight="400">输入、步骤、输出是什么？</text><rect x="24" y="552" width="512" height="128" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="590" font-size="25" fill="#244fe3" font-weight="700">scripts / assets → 配套资源</text><text x="42" y="628" font-size="24" fill="#182341" font-weight="400">执行什么代码、需要哪些依赖？</text><text x="42" y="661" font-size="24" fill="#59657e" font-weight="400">读写哪些文件、用哪些模板？</text><rect x="24" y="700" width="512" height="128" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="738" font-size="25" fill="#244fe3" font-weight="700">练习副本 → 三组小测试</text><text x="42" y="776" font-size="24" fill="#182341" font-weight="400">正确输入 / 故意错误 / 信息缺失</text><text x="42" y="809" font-size="24" fill="#59657e" font-weight="400">打开成果，再决定保留或停用</text></g></svg>