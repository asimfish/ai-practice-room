<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">把工具说明和文件实测分成两列</title><desc id="desc">比较里的每个能力主张由什么证据支持？。同一个可验收问题：同一can/can’t材料→三页可编辑PPT；只研究课程已有官方来源，记录页面日期与条件；实际小测仍用同一题库、同一三页要求。教学示范·主张与证据卡：官方文档支持与本机已完成检查分别记；访问失败、费用未知、未运行均明确标出；抽查三条主张后，才写工具比较结论。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf1fc" stroke="none"/><text x="30" y="52" font-size="32" fill="#315e9e" font-weight="750"><tspan x="30" dy="0">把工具说明和文件实测分成两列</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#315e9e"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#315e9e" font-weight="700"><tspan x="120" dy="0">同一个可验收问题</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">同一can/can’t材料→</tspan><tspan x="64" dy="32.400000000000006">三页可编辑PPT</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">只研究课程已有官方来源</tspan><tspan x="64" dy="32.400000000000006">，记录页面日期与条件</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">实际小测仍用同一题库、</tspan><tspan x="64" dy="32.400000000000006">同一三页要求</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#315e9e" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#315e9e" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·主张与证据卡</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#eaf1fc" stroke="none"/><circle cx="454" cy="215" r="15" fill="#315e9e"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">引用确实支持对应主张，访问失败没有补</tspan><tspan x="481" dy="31.05">写</tspan></text><circle cx="454" cy="278" r="15" fill="#315e9e"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">可编辑性需实际选中改字，不以宣传替代</tspan></text><circle cx="454" cy="341" r="15" fill="#315e9e"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">费用和账号未知项未写成免费或不限量</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#315e9e" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>