<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">销售汇报每个观点都能追溯到材料</title><desc id="desc">图表、计算和解释是否各有对应依据？。三份已有材料：S1：销售CSV，8行、4个月、2区域；S2：简报，元、练习利润与比例口径；S3：教师答案，独立计算后用于核对。示范·证据映射与10页稿：主结论：收入上升、总完成率100.71%、原因未知；页1–3背景口径总指标，4–7月度与区域证据；页8–10增长解释、限制与下一步。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#fff1e5" stroke="none"/><text x="30" y="52" font-size="32" fill="#aa5728" font-weight="750"><tspan x="30" dy="0">销售汇报每个观点都能追溯到材料</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="53" y="125" width="43" height="53" rx="6" fill="#aa5728"/><path d="M63 139h23m-23 12h23m-23 12h18" stroke="white" stroke-width="3"/><text x="120" y="153" font-size="25" fill="#aa5728" font-weight="700"><tspan x="120" dy="0">三份已有材料</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">S1：销售CSV，8行、4个</tspan><tspan x="64" dy="32.400000000000006">月、2区域</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">S2：简报，元、练习利</tspan><tspan x="64" dy="32.400000000000006">润与比例口径</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">S3：教师答案，独立计</tspan><tspan x="64" dy="32.400000000000006">算后用于核对</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#aa5728" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#aa5728" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">示范·证据映射与10页稿</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#fff1e5" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">主结论：收入上升、总完成率100.71%、</tspan><tspan x="450" dy="35.1">原因未知</tspan></text><text x="450" y="292.2" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">页1–3背景口径总指标，4–7月度与区</tspan><tspan x="450" dy="35.1">域证据</tspan></text><text x="450" y="366.4" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">页8–10增长解释、限制与下一步</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#aa5728" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>