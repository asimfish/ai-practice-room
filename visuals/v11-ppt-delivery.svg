<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">从填好的课件到可打开的交付包</title><desc id="desc">文件、投影、试讲和静态备份是否分别检查？。待交付稿：社区电脑课四页PPTX、讲稿与来源说明；第3页三个时段，合计60分钟；第4页三个确切文件名。教学示范·交付清单：可编辑PPTX＋四页PDF＋讲稿；逐页放映、改字和重新打开分别登记；未运行的兼容或动画检查保持未运行。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#fff1e5" stroke="none"/><text x="30" y="52" font-size="32" fill="#aa5728" font-weight="750"><tspan x="30" dy="0">从填好的课件到可打开的交付包</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#aa5728"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#aa5728" font-weight="700"><tspan x="120" dy="0">待交付稿</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">社区电脑课四页PPTX、</tspan><tspan x="64" dy="32.400000000000006">讲稿与来源说明</tspan></text><text x="64" y="287" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">第3页三个时段，合计60</tspan><tspan x="64" dy="32.400000000000006">分钟</tspan></text><text x="64" y="354" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">第4页三个确切文件名</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#aa5728" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#aa5728" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·交付清单</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#fff1e5" stroke="none"/><circle cx="454" cy="215" r="15" fill="#aa5728"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">PPTX能选中改字，PDF重新打开为四页</tspan></text><circle cx="454" cy="278" r="15" fill="#aa5728"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">三时段10＋25＋25＝60分钟</tspan></text><circle cx="454" cy="341" r="15" fill="#aa5728"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">路径、版本和实际检查范围明确</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#aa5728" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>