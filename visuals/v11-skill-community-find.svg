<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">同一写作任务，追到两个原作者再选</title><desc id="desc">候选热度之外，哪些差异影响自己的选择？。需要改善的一步：任务：检查成人AI练习说明；候选A：Vercel writing-guidelines；候选B：Anthropic doc-coauthoring。有依据的选择或暂缓：同材料比较用途与流程；资源、工具、许可和费用逐项核；选择理由指向原说明，不靠排名。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f0edfb" stroke="none"/><text x="30" y="52" font-size="32" fill="#6650ae" font-weight="750"><tspan x="30" dy="0">同一写作任务，追到两个原作者再选</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#6650ae"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#6650ae" font-weight="700"><tspan x="120" dy="0">需要改善的一步</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">任务：检查成人AI练习</tspan><tspan x="64" dy="32.400000000000006">说明</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">候选A：Vercel </tspan><tspan x="64" dy="32.400000000000006">writing-guidelines</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">候选B：Anthropic doc</tspan><tspan x="64" dy="32.400000000000006">-coauthoring</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#6650ae" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#6650ae" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">有依据的选择或暂缓</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#f0edfb" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">同材料比较用途与流程</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">资源、工具、许可和费用逐项核</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">选择理由指向原说明，不靠排名</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#6650ae" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>