<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">总花费增加，每条成本却下降</title><desc id="desc">该比较总金额，还是每条成片成本？。本课虚构数据：3月：花费60元，成片3条；4月：花费80元，成片5条；同为元/成片；质量与其他条件未知。教学示范·成本比较页：3月60÷3＝20元/条；4月80÷5＝16元/条；每条成本下降4元，即20%；观察限这两个月，不推出工具最好或收益。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#fff1e5" stroke="none"/><text x="30" y="52" font-size="32" fill="#aa5728" font-weight="750"><tspan x="30" dy="0">总花费增加，每条成本却下降</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="48" y="130" width="56" height="45" rx="5" fill="#aa5728"/><path d="M48 145h56m-56 15h56m-38-30v45m20-45v45" stroke="white" stroke-width="2"/><text x="120" y="153" font-size="25" fill="#aa5728" font-weight="700"><tspan x="120" dy="0">本课虚构数据</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">3月：花费60元，成片3</tspan><tspan x="64" dy="32.400000000000006">条</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">4月：花费80元，成片5</tspan><tspan x="64" dy="32.400000000000006">条</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">同为元/成片；质量与其</tspan><tspan x="64" dy="32.400000000000006">他条件未知</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#aa5728" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#aa5728" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·成本比较页</tspan></text><text x="430" y="194" font-size="24" fill="#aa5728" font-weight="700"><tspan x="430" dy="0">每条成本（元/条）</tspan></text><path d="M493 416h434" stroke="#d9e4ec" stroke-width="1"/><text x="450" y="422" font-size="18" fill="#617489" font-weight="500"><tspan x="450" dy="0">0</tspan></text><path d="M493 371h434" stroke="#d9e4ec" stroke-width="1"/><text x="450" y="377" font-size="18" fill="#617489" font-weight="500"><tspan x="450" dy="0">5</tspan></text><path d="M493 326h434" stroke="#d9e4ec" stroke-width="1"/><text x="450" y="332" font-size="18" fill="#617489" font-weight="500"><tspan x="450" dy="0">10</tspan></text><path d="M493 281h434" stroke="#d9e4ec" stroke-width="1"/><text x="450" y="287" font-size="18" fill="#617489" font-weight="500"><tspan x="450" dy="0">15</tspan></text><path d="M493 236h434" stroke="#d9e4ec" stroke-width="1"/><text x="450" y="242" font-size="18" fill="#617489" font-weight="500"><tspan x="450" dy="0">20</tspan></text><rect x="550" y="236" width="112" height="180" rx="5" fill="#aa5728" stroke="none"/><text x="590" y="223" font-size="25" fill="#aa5728" font-weight="700"><tspan x="590" dy="0">20</tspan></text><text x="582" y="444" font-size="20" fill="#334e64" font-weight="600"><tspan x="582" dy="0">3月</tspan></text><rect x="745" y="272" width="112" height="144" rx="5" fill="#a97842" stroke="none"/><text x="785" y="259" font-size="25" fill="#aa5728" font-weight="700"><tspan x="785" dy="0">16</tspan></text><text x="777" y="444" font-size="20" fill="#334e64" font-weight="600"><tspan x="777" dy="0">4月</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#aa5728" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>