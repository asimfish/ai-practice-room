<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 690" role="img"><title>分层阅读支持示意</title><desc>本站原创教学示意，不是软件界面截图</desc><rect width="640" height="690" rx="20" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif" fill="#182341"><text x="26" y="48" font-size="28" fill="#182341" font-weight="700">分层练习：改变支持，保留目标</text><text x="26" y="82" font-size="21" fill="#59657e" font-weight="400">原创教学示意 · 按学生实际情况调整</text><rect x="24" y="108" width="592" height="110" rx="14" fill="#eef3ff" stroke="#d8e0f2"/><text x="42" y="146" font-size="25" fill="#244fe3" font-weight="700">共同目标</text><text x="42" y="192" font-size="25" fill="#182341" font-weight="400">读同一故事，找到人物、地点和事件</text><rect x="24" y="242" width="592" height="169" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="281" font-size="26" fill="#244fe3" font-weight="700">基础支持</text><text x="42" y="324" font-size="25" fill="#182341" font-weight="400">给词库、句框、图片或更短分段</text><text x="42" y="367" font-size="25" fill="#182341" font-weight="400">先定位答案，再用一句话表达</text><rect x="24" y="435" width="592" height="169" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="474" font-size="26" fill="#244fe3" font-weight="700">提高任务</text><text x="42" y="517" font-size="25" fill="#182341" font-weight="400">撤去部分支持，解释原文证据</text><text x="42" y="560" font-size="25" fill="#182341" font-weight="400">不偷偷增加另一套语法目标</text><text x="28" y="651" font-size="25" fill="#244fe3" font-weight="400">教师核对：答案、词汇、目标和歧义</text></g></svg>