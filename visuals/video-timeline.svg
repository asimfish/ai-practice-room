<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" role="img"><title>30秒作品时间线</title><desc>本站原创教学示意，不是软件界面截图</desc><rect width="640" height="790" rx="20" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif" fill="#182341"><text x="26" y="48" font-size="29" fill="#182341" font-weight="700">30秒视频：让声音带着画面走</text><text x="26" y="82" font-size="21" fill="#59657e" font-weight="400">原创时间线示意 · 按实际朗读调整</text><rect x="24" y="108" width="592" height="102" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="141" font-size="25" fill="#244fe3" font-weight="700">0–4秒</text><text x="218" y="141" font-size="25" fill="#182341" font-weight="700">问题卡</text><text x="42" y="184" font-size="25" fill="#182341" font-weight="400">观众遇到什么困惑</text><rect x="24" y="228" width="592" height="102" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="261" font-size="25" fill="#244fe3" font-weight="700">4–12秒</text><text x="218" y="261" font-size="25" fill="#182341" font-weight="700">例子一</text><text x="42" y="304" font-size="25" fill="#182341" font-weight="400">画面、台词、字幕说同一件事</text><rect x="24" y="348" width="592" height="102" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="381" font-size="25" fill="#244fe3" font-weight="700">12–21秒</text><text x="218" y="381" font-size="25" fill="#182341" font-weight="700">例子二</text><text x="42" y="424" font-size="25" fill="#182341" font-weight="400">解释区别，只用必要镜头</text><rect x="24" y="468" width="592" height="102" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="501" font-size="25" fill="#244fe3" font-weight="700">21–27秒</text><text x="218" y="501" font-size="25" fill="#182341" font-weight="700">给观众一道题</text><text x="42" y="544" font-size="25" fill="#182341" font-weight="400">留出阅读与思考时间</text><rect x="24" y="588" width="592" height="102" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="42" y="621" font-size="25" fill="#244fe3" font-weight="700">27–30秒</text><text x="218" y="621" font-size="25" fill="#182341" font-weight="700">揭晓与回顾</text><text x="42" y="664" font-size="25" fill="#182341" font-weight="400">告诉观众本条学会什么</text><text x="28" y="751" font-size="24" fill="#244fe3" font-weight="400">字幕校对 → 导出 → 完整看一遍 → 记录成本</text></g></svg>