<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">学习日报技能用三种输入检验</title><desc id="desc">流程规则能否处理完整、缺失和无关输入？。已有虚构日志：R01：12张词卡初稿，2例句待核查；R02：大纲已审核，3页小样待制作；R03：45秒口播已读，4分镜，画面未生成。教学示范·单用途技能约定：明确说整理学习日报且有当天记录才适用；每条进展带记录编号，未知项先问；本地草稿，不发送；连接器能力另行核对。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#eaf1fc" stroke="none"/><text x="30" y="52" font-size="32" fill="#315e9e" font-weight="750"><tspan x="30" dy="0">学习日报技能用三种输入检验</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 131h21l7 9h30v34h-58z" fill="#315e9e"/><path d="M57 150h39m-39 10h30" stroke="white" stroke-width="4"/><text x="120" y="153" font-size="25" fill="#315e9e" font-weight="700"><tspan x="120" dy="0">已有虚构日志</tspan></text><path d="M64 195v183m0-140h20m-20 70h20m-20 70h20" stroke="#315e9e" stroke-width="3" fill="none"/><text x="90" y="221" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">R01：12张词卡初稿，</tspan><tspan x="90" dy="32.400000000000006">2例句待核查</tspan></text><text x="90" y="289.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">R02：大纲已审核，3</tspan><tspan x="90" dy="32.400000000000006">页小样待制作</tspan></text><text x="90" y="358.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="90" dy="0">R03：45秒口播已读，</tspan><tspan x="90" dy="32.400000000000006">4分镜，画面未生成</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#315e9e" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#315e9e" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">教学示范·单用途技能约定</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#eaf1fc" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">明确说整理学习日报且有当天记录才适用</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">每条进展带记录编号，未知项先问</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">本地草稿，不发送；连接器能力另行核对</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#315e9e" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>