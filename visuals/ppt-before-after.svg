<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 804" role="img"><title>PPT修改前后示意</title><desc>本站原创教学示意，不是软件界面截图</desc><rect width="560" height="804" rx="20" fill="#f5f7fb"/><g font-family="Arial Unicode MS,Microsoft YaHei,sans-serif" fill="#182341"><text x="26" y="48" font-size="29" fill="#182341" font-weight="700">一页PPT怎样从杂乱到清楚</text><text x="26" y="82" font-size="21" fill="#59657e" font-weight="400">原创内容结构示意 · 不是模板截图</text><rect x="24" y="108" width="512" height="250" rx="14" fill="#fff7ef" stroke="#d8e0f2"/><text x="44" y="148" font-size="26" fill="#905415" font-weight="700">修改前：把资料全塞进一页</text><text x="44" y="193" font-size="24" fill="#182341" font-weight="400">收入、成本、利润、目标、计划……</text><text x="44" y="237" font-size="24" fill="#182341" font-weight="400">每个数字都一样大，找不到重点</text><text x="44" y="282" font-size="24" fill="#182341" font-weight="400">图表无单位，结论超过数据范围</text><text x="44" y="324" font-size="23" fill="#905415" font-weight="400">问题：听众不知道该记住什么</text><text x="235" y="404" font-size="40" fill="#244fe3" font-weight="400">↓</text><rect x="24" y="428" width="512" height="340" rx="14" fill="#eef3ff" stroke="#d8e0f2"/><text x="44" y="471" font-size="26" fill="#244fe3" font-weight="700">修改后：一页只讲一个论点</text><text x="44" y="519" font-size="24" fill="#182341" font-weight="700">标题：3月收入比2月增加5000元</text><rect x="44" y="545" width="205" height="122" rx="14" fill="#fff" stroke="#d8e0f2"/><rect x="269" y="545" width="243" height="122" rx="14" fill="#fff" stroke="#d8e0f2"/><text x="62" y="581" font-size="23" fill="#244fe3" font-weight="700">证据</text><text x="62" y="619" font-size="24" fill="#182341" font-weight="400">33000 →</text><text x="62" y="650" font-size="24" fill="#182341" font-weight="400">38000元</text><text x="287" y="581" font-size="23" fill="#244fe3" font-weight="700">判断边界</text><text x="287" y="616" font-size="23" fill="#182341" font-weight="400">只能描述这份</text><text x="287" y="643" font-size="23" fill="#182341" font-weight="400">虚构练习数据</text><text x="44" y="700" font-size="24" fill="#182341" font-weight="400">页脚：数据来源、单位、月份</text><text x="44" y="742" font-size="24" fill="#59657e" font-weight="400">再到PowerPoint/WPS打开检查</text></g></svg>