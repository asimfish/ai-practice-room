<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">一页资料转复习卡，再做五轮口语</title><desc id="desc">怎样把文件事实核对与语音纠错分开检查？。一页匿名练习材料：学生A，10岁；jump/swim/fly/run；目标：用can/can’t表达能力；教师材料含动词原形规则。复习卡与纠错笔记：5道题、答案和原文位置；可用时口语对话5轮；保留3个练习点，听不清先问。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#e6f5ee" stroke="none"/><text x="30" y="52" font-size="32" fill="#257962" font-weight="750"><tspan x="30" dy="0">一页资料转复习卡，再做五轮口语</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><path d="M48 127h52v34h-30l-15 12v-12h-7z" fill="#257962"/><circle cx="61" cy="144" r="3" fill="white"/><circle cx="74" cy="144" r="3" fill="white"/><circle cx="87" cy="144" r="3" fill="white"/><text x="120" y="153" font-size="25" fill="#257962" font-weight="700"><tspan x="120" dy="0">一页匿名练习材料</tspan></text><rect x="47" y="183" width="290" height="225" rx="15" fill="#e6f5ee" stroke="none"/><text x="63" y="219" font-size="24" fill="#263e52" font-weight="500"><tspan x="63" dy="0">学生A，10岁；jump/sw</tspan><tspan x="63" dy="32.400000000000006">im/fly/run</tspan></text><text x="63" y="286" font-size="24" fill="#263e52" font-weight="500"><tspan x="63" dy="0">目标：用can/can’t表</tspan><tspan x="63" dy="32.400000000000006">达能力</tspan></text><text x="63" y="353" font-size="24" fill="#263e52" font-weight="500"><tspan x="63" dy="0">教师材料含动词原形规则</tspan></text><path d="M61 408v15l22-15z" fill="#e6f5ee"/><path d="M372 262h22m-8-8l8 8-8 8" stroke="#257962" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#257962" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">复习卡与纠错笔记</tspan></text><rect x="425" y="173" width="525" height="248" rx="12" fill="#e6f5ee" stroke="none"/><text x="450" y="218" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">5道题、答案和原文位置</tspan></text><text x="450" y="285" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">可用时口语对话5轮</tspan></text><text x="450" y="352" font-size="26" fill="#263e52" font-weight="500"><tspan x="450" dy="0">保留3个练习点，听不清先问</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#257962" font-weight="650"><tspan x="48" dy="0">看清输入 → 做一次小样 → 对照标准修改</tspan></text></svg>