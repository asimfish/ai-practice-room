<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc"><title id="title">一个观察、一项修改、同问题复看</title><desc id="desc">观众真的没看懂哪里，原因仍有哪些未知？。复盘输入：自己的真实作品版本与当前状态；实际盲看复述或允许处理的公开反馈；可见指标原名、范围与观察时间。复盘示范目标：观察事实与可能原因分开；只改一项并保留前后版本；真实复看结果与未知数据明确。原创教学示意，不是产品截图或实际模型输出。</desc><style>text{font-family:'PingFang SC','Microsoft YaHei',Arial,sans-serif}</style><rect x="0" y="0" width="1000" height="540" rx="20" fill="#f4edfc" stroke="none"/><text x="30" y="52" font-size="32" fill="#784da0" font-weight="750"><tspan x="30" dy="0">一个观察、一项修改、同问题复看</tspan></text><text x="31" y="84" font-size="18" fill="#617585" font-weight="500"><tspan x="31" dy="0">AI练习生 · 本课教学示意</tspan></text><rect x="28" y="105" width="332" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><circle cx="77" cy="153" r="27" fill="#784da0"/><path d="M62 153l10 11 19-24" fill="none" stroke="white" stroke-width="5"/><text x="120" y="153" font-size="25" fill="#784da0" font-weight="700"><tspan x="120" dy="0">复盘输入</tspan></text><rect x="47" y="183" width="292" height="245" rx="7" fill="#f8fafc" stroke="#e0e7f0"/><text x="64" y="220" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">自己的真实作品版本与当</tspan><tspan x="64" dy="32.400000000000006">前状态</tspan></text><text x="64" y="288.8" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">实际盲看复述或允许处理</tspan><tspan x="64" dy="32.400000000000006">的公开反馈</tspan></text><text x="64" y="357.6" font-size="24" fill="#263e52" font-weight="500"><tspan x="64" dy="0">可见指标原名、范围与观</tspan><tspan x="64" dy="32.400000000000006">察时间</tspan></text><path d="M372 262h22m-8-8l8 8-8 8" stroke="#784da0" stroke-width="4" fill="none"/><rect x="403" y="105" width="570" height="340" rx="18" fill="#fff" stroke="#d7e4ed"/><rect x="423" y="123" width="246" height="34" rx="8" fill="#784da0" stroke="none"/><text x="435" y="147" font-size="18" fill="#fff" font-weight="700"><tspan x="435" dy="0">复盘示范目标</tspan></text><rect x="425" y="175" width="525" height="238" rx="12" fill="#f4edfc" stroke="none"/><circle cx="454" cy="215" r="15" fill="#784da0"/><path d="M447 215l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="219" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">观众复述实际收集，未收反馈或数据明确</tspan><tspan x="481" dy="31.05">不可得。</tspan></text><circle cx="454" cy="278" r="15" fill="#784da0"/><path d="M447 278l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="282" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">观察、解释、修改和复看结果分别记录。</tspan></text><circle cx="454" cy="341" r="15" fill="#784da0"/><path d="M447 341l5 5 9-11" stroke="white" stroke-width="3" fill="none"/><text x="481" y="345" font-size="23" fill="#263e52" font-weight="500"><tspan x="481" dy="0">小样本不证明因果或收益；非公开数据按</tspan><tspan x="481" dy="31.05">本人规则处理。</tspan></text><rect x="28" y="462" width="945" height="56" rx="10" fill="#fff" stroke="none"/><text x="48" y="498" font-size="24" fill="#784da0" font-weight="650"><tspan x="48" dy="0">看清要求 → 按步骤试做 → 对照标准修改</tspan></text></svg>